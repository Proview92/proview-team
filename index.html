<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proview Team</title>
<link rel="icon" type="image/svg+xml" href="icon-app.svg">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--main:#3f5fd0;--bgc:#f2f4f9;--bg:var(--bgc);--card:#fff;--ink:#14161f;--mut:#5b6072;--line:#dde1ea;--pri:var(--main);--pril:color-mix(in srgb,var(--main) 14%,#fff);--ok:#12874a;--okl:#e2f4ea;--warn:#9a5b00;--warnl:#fbefd6;--bad:#c62a1f;--badl:#fce8e6;--nav:color-mix(in srgb,var(--main) 35%,#111);--onpri:#fff;--purp:#7c5ac7;color-scheme:light;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171c29;--card:#212839;--ink:#f2f4fa;--mut:#aab2c8;--line:#3a4560;--pri:color-mix(in srgb,var(--main) 60%,#fff);--pril:color-mix(in srgb,var(--main) 24%,#212839);--ok:#5ad69f;--okl:#1b3a30;--warn:#f2c066;--warnl:color-mix(in srgb,#f2c066 12%,#212839);--bad:#f68c82;--badl:#41262d;--nav:color-mix(in srgb,var(--main) 26%,#0d121f);--onpri:#0d0f15;--purp:#b49af0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171c29;--card:#212839;--ink:#f2f4fa;--mut:#aab2c8;--line:#3a4560;--pri:color-mix(in srgb,var(--main) 60%,#fff);--pril:color-mix(in srgb,var(--main) 24%,#212839);--ok:#5ad69f;--okl:#1b3a30;--warn:#f2c066;--warnl:color-mix(in srgb,#f2c066 12%,#212839);--bad:#f68c82;--badl:#41262d;--nav:color-mix(in srgb,var(--main) 26%,#0d121f);--onpri:#0d0f15;--purp:#b49af0;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
h2{margin:0 0 10px;font-size:16px;font-weight:700}
h3{margin:0 0 6px;font-size:14px}
p{margin:0 0 8px}
small,.mut{color:var(--mut)}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:var(--sw,232px) minmax(0,1fr);height:100%}
.app.col{--sw:68px}
.side{background:var(--nav);color:#c5c9d8;display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto;min-height:0;gap:2px}
.brand{color:#fff;font-weight:700;font-size:16px;padding:6px 10px 12px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand .lg{width:30px;height:30px;border-radius:9px;background:var(--main);display:grid;place-items:center;flex:none;color:#fff;font-size:15px}
.brand small{display:block;color:#aeb4c8;font-weight:500;font-size:11px;line-height:1.2;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ng{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#8f96ae;padding:12px 12px 4px;display:flex;align-items:center;justify-content:space-between;background:none;border:0;width:100%;text-align:left;cursor:default}
button.ng{cursor:pointer}
.nv{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;min-height:42px;cursor:pointer;background:none;border:0;color:inherit;width:100%;text-align:left;font-weight:500}
.nv:hover{background:rgba(255,255,255,.07)}
.nv.on{background:rgba(255,255,255,.2);color:#fff}
.nv .bdg{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.18);color:#fff;border-radius:99px;padding:1px 8px}
.nv .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{flex:1}
.nvb{margin-top:6px;background:rgba(255,255,255,.08);color:#fff;font-weight:600}
.col .lbl,.col .ng span,.col .bdg,.col .brand div,.col .sub{display:none}
.col .nv{justify-content:center;padding:8px}
.col .ng{padding:6px 0;justify-content:center}
.col .ng:after{content:"";width:22px;height:1px;background:rgba(255,255,255,.18)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:8px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{margin-right:6px}
.top select{width:auto;max-width:200px}
.ib{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:inline-grid;place-items:center;cursor:pointer;position:relative;padding:0;flex:none}
.ib:hover{border-color:var(--pri)}
.ib .dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.sv{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:12px;font-weight:600}
.sv:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sv.bad:before{background:var(--bad)}
.content{flex:1;overflow:auto;padding:18px 20px 40px}
.content>.alert{margin-bottom:14px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px;min-height:32px}
.btn.lg{min-height:56px;font-size:17px;padding:12px 22px;border-radius:14px}
.btn.danger{color:var(--bad)}
.btn.ok{background:var(--okl);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.btn.bad{background:var(--badl);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.pad{padding:16px}
.card.pad>h2:first-child{margin-top:0}
.card>.hd{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card>.hd h2{margin:0;flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{padding:12px 14px}
.stat small{display:block;font-weight:600}
.stat b{font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat em{display:block;font-style:normal;color:var(--mut);font-size:12px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--card);flex:none}
.seg button{border:0;background:none;padding:6px 13px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--mut);min-height:34px}
.seg button.on{background:var(--pril);color:var(--pri)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap;min-height:44px}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.tabs button small{margin-left:4px;font-weight:700;background:var(--line);border-radius:99px;padding:0 7px}
input,select,textarea{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 10px;width:100%;min-height:40px}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--pri)}
textarea{min-height:70px;resize:vertical}
.bar input[type=search],.bar input[type=text]{width:200px}
.bar select{width:auto;max-width:200px}
.dn{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.dn button{background:none;border:0;padding:0;cursor:pointer;width:40px;height:38px;display:grid;place-items:center}
.dn span{padding:0 6px;font-weight:600;min-width:150px;text-align:center;white-space:nowrap}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--line);color:var(--mut);text-align:center;white-space:nowrap}
.chip.blue{background:var(--pril);color:var(--pri)}
.chip.green{background:var(--okl);color:var(--ok)}
.chip.amber{background:var(--warnl);color:var(--warn)}
.chip.red{background:var(--badl);color:var(--bad)}
.chip.purple{background:color-mix(in srgb,var(--purp) 18%,var(--card));color:var(--purp)}
.empty{padding:34px 16px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.alert{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--badl);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);font-weight:600}
.alert.warn{background:var(--warnl);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.alert.info{background:var(--pril);color:var(--pri);border-color:color-mix(in srgb,var(--pri) 30%,transparent)}
.alert .sp{flex:1}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:start}
.dg{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media(max-width:1100px){.dg{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:14px;min-width:0}
.tw{overflow:auto}
table.t{width:100%;border-collapse:collapse}
table.t th,table.t td{padding:9px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-size:11.5px;font-weight:700;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;border-top:0;white-space:nowrap;background:var(--card);position:sticky;top:0}
table.t td.r,table.t th.r{text-align:right}
table.t tr.clk{cursor:pointer}
table.t tr.clk:hover td{background:color-mix(in srgb,var(--ink) 4%,var(--card))}
table.t tfoot td{background:color-mix(in srgb,var(--ink) 4%,var(--card));font-weight:700}
table.t td small{display:block}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12.5px;color:#fff;flex:none}
.av.sm{width:26px;height:26px;font-size:10.5px}
.av.lg{width:54px;height:54px;font-size:18px}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri);border-radius:99px}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
.bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:11px;color:var(--mut)}
.bars .col i{display:block;width:100%;background:var(--pri);border-radius:5px 5px 0 0;min-height:2px}
.bars .col b{color:var(--ink);font-size:11.5px}
.hb{display:grid;grid-template-columns:110px minmax(0,1fr) 64px;gap:10px;align-items:center;padding:5px 0}
.hb .prog{height:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:12.5px;margin:8px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px}
.tg{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tg:first-of-type{border-top:0}
.tg .tx{flex:1;min-width:0}
.tg .tx b{display:block}
.tg .tx small{display:block}
.sw2{position:relative;width:44px;height:26px;flex:none}
.sw2 input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw2 i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.15s}
.sw2 i:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw2 input:checked+i{background:var(--pri)}
.sw2 input:checked+i:after{left:21px}
.sw2 input:focus-visible+i{outline:2px solid var(--pri);outline-offset:2px}
.ck{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;font-weight:600;min-height:36px;user-select:none;background:var(--card)}
.ck input{position:absolute;opacity:0;pointer-events:none}
.ck:has(input:checked){background:var(--pril);color:var(--pri);border-color:var(--pri)}
.ck:has(input:focus-visible){outline:2px solid var(--pri);outline-offset:2px}
.cks{display:flex;gap:6px;flex-wrap:wrap}
.lab{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:12.5px;color:var(--mut);margin-bottom:10px}
.lab.row{flex-direction:row;align-items:center;gap:8px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.pbd{position:fixed;inset:0;background:rgba(10,12,20,.5);z-index:60;opacity:0;transition:opacity .18s}
.pbd.on{opacity:1}
/* forms open as a centred pop-up, like the booking system */
.pnl{position:fixed;left:50%;top:calc(var(--vvt,0px) + var(--vvh,100dvh)/2);width:min(560px,calc(100vw - 16px));max-height:min(calc(var(--vvh,100dvh) - 16px),860px);background:var(--card);z-index:61;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;opacity:0;transform:translate(-50%,-47%) scale(.98);transition:transform .16s,opacity .16s;box-shadow:0 14px 48px rgba(0,0,0,.4)}
.pnl.sm{width:min(360px,calc(100vw - 24px))}
.pnl.wide{width:min(1040px,calc(100vw - 16px));max-height:min(calc(var(--vvh,100dvh) - 16px),94vh)}
.paper .ppg thead th{position:sticky;top:-16px;z-index:2}
.pnl.on{opacity:1;transform:translate(-50%,-50%)}
.pnl .ph{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 18px;border-bottom:1px solid var(--line);flex:none}
.pnl .ph h2{margin:0;flex:1;font-size:17px}
.pnl .pb{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 18px 8px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;outline:none}
.pnl .pb .lab{margin-bottom:8px}
.pnl .pb textarea{min-height:56px}
.pnl .pb .f2,.pnl .pb .f3{grid-template-columns:1fr 1fr;gap:8px}
.pnl .pb .f3{grid-template-columns:1fr 1fr 1fr}
.pnl .pb h3{margin:12px 0 6px}
.pnl .pf{display:flex;gap:8px;justify-content:flex-end;padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex-wrap:wrap;flex:none;background:var(--card)}
.pnl .pf .sp{flex:1}
@media(max-width:700px){.pnl{width:calc(100vw - 12px);max-height:calc(var(--vvh,100dvh) - 12px);border-radius:14px}.pnl .pb{padding:10px 14px 6px}.pnl .ph{padding:8px 10px 8px 14px}.pnl .pb .f3{grid-template-columns:1fr 1fr}}
.mdl{position:fixed;inset:0;background:rgba(10,12,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:10vh 12px 12px;z-index:70;overflow:auto}
.mdl .sheet{background:var(--card);border-radius:14px;width:100%;max-width:440px;padding:20px;display:grid;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.mdl .sheet.big{max-width:620px}
.mdl .sheet .r{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.srch .sheet{padding:10px;max-width:560px}
.srch .res{max-height:50vh;overflow:auto;display:grid}
.srch .res button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer;min-height:44px}
.srch .res button.on,.srch .res button:hover{background:var(--pril)}
.srch .res .ghd{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:8px 10px 2px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
.pop{position:absolute;right:0;top:46px;background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:240px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:50;padding:6px;text-align:left}
.pop button,.pop a{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:8px;cursor:pointer;min-height:42px;color:var(--ink)}
.pop button:hover{background:var(--pril)}
.pop .hd{padding:10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.rel{position:relative}
.tsg th,.tsg td{padding:7px 8px}
.cell{display:block;width:100%;min-height:40px;border-radius:8px;border:1px dashed transparent;background:none;text-align:center;cursor:pointer;padding:4px 2px;font-variant-numeric:tabular-nums}
.cell:hover{border-color:var(--pri);background:var(--pril)}
.cell.rest{color:var(--mut);cursor:default}
.cell.rest span{font-size:11px;background:var(--line);border-radius:99px;padding:1px 8px}
.cell.hol{background:var(--warnl)}
.shift{display:block;width:100%;border:0;border-left:4px solid var(--pri);background:var(--pril);color:var(--pri);border-radius:8px;padding:4px 7px;text-align:left;font-weight:600;font-size:12px;cursor:pointer;margin-bottom:3px;line-height:1.25}
.shift small{display:block;font-weight:500;color:inherit;opacity:.85}
.shift.draft{}
.shift.open{background:var(--badl);color:var(--bad);border-left-color:var(--bad)}
.shift.ot{box-shadow:inset 0 0 0 2px var(--purp)}
.shift.cov{background:color-mix(in srgb,var(--ink) 6%,var(--card));color:var(--mut);border-left-color:var(--mut)}
.addc{display:grid;place-items:center;width:100%;min-height:38px;border:1px dashed var(--line);border-radius:8px;background:none;color:var(--mut);cursor:pointer}
.addc:hover{border-color:var(--pri);color:var(--pri)}
.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;align-items:start}
.kb .colm{background:color-mix(in srgb,var(--ink) 4%,var(--bg));border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.kb .colm>h3{display:flex;align-items:center;gap:8px;margin:0 0 2px}
.tk{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;cursor:pointer;text-align:left;width:100%}
.tk:hover{border-color:var(--pri)}
.tk.done b{text-decoration:line-through;color:var(--mut)}
.tk .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mut)}
.tkc{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.tkc:first-child{border-top:0}
.cb{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none;padding:0;color:transparent}
.cb.on{background:var(--ok);border-color:var(--ok);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.cal .dh{padding:8px;font-size:11.5px;font-weight:700;text-align:center;color:var(--mut);border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
.cal .dc{min-height:88px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:grid;gap:2px;align-content:start;font-size:11.5px;min-width:0}
.cal .dc:nth-child(7n){border-right:0}
.cal .dc.we{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--ink) 5%,transparent) 6px 7px)}
.cal .dc.oth{opacity:.45}

/* sign-in page */
.login.pvs-root>.pvs-auth{width:100%;max-width:none;margin:0}
.pvs-auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100%}
.pvs-auth.solo{grid-template-columns:1fr}
.pvs-art{background:#141418;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;min-height:100vh}
.pvs-brand{display:flex;align-items:center;gap:10px}
.pvs-art h2{font-size:clamp(30px,3.2vw,40px);line-height:1.05;max-width:400px;letter-spacing:-.03em;margin:0;font-weight:700;position:relative;z-index:1}
.pvs-art .sub{color:#9a9aa4;max-width:300px;font-size:15px;line-height:1.45;position:relative;z-index:1}
.pvs-mock{position:absolute;pointer-events:none;z-index:0;right:-40px;bottom:56px;width:380px;transform:rotate(-5deg);background:#1f1f26;border:1px solid #33333c;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 30px 70px rgba(0,0,0,.45);color:#fff}
.pvs-mock .hd{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.pvs-mock .hd span{font-size:11px;color:#9a9aa4}
.pvs-mock .rw{display:flex;align-items:center;gap:10px;background:#18181d;border:1px solid #2c2c34;border-radius:10px;padding:9px 11px;font-size:12px}
.pvs-mock .rw b{font-size:12.5px;min-width:40px}
.pvs-mock .rw em{font-style:normal;color:#c9c9d1;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvs-mock .rw span{font-size:10.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pvs-mock .s{background:linear-gradient(90deg,#62b0ec,#8b88dc);color:#fff}
.pvs-mock .r{background:rgba(98,176,236,.12);color:#9fd0f5;box-shadow:inset 0 0 0 1.5px #62b0ec}
.pvs-mock .f{color:#77777f;box-shadow:inset 0 0 0 1.5px #4a4a54}
.pvs-form{display:grid;place-items:center;padding:32px 20px}
.pvs-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px 32px;width:min(440px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(20,20,30,.04),0 18px 50px -18px rgba(20,20,30,.18);margin:0}
.pvs-card.wide{width:min(720px,100%)}
.pvs-card .pvs-brand{gap:12px;margin-bottom:8px}
.pvs-card .pvs-brand .pvlogo{width:60px;height:60px}
.pvs-card .pvs-brand .pvword{font-size:20px;letter-spacing:.14em;color:var(--ink)}
.pvs-card h1{font-size:26px;line-height:1.2;margin:0;letter-spacing:-.02em;font-weight:700;color:var(--ink)}
.pvs-card .muted{color:var(--mut);margin:0;font-size:15px;line-height:1.45}
.pvs-card label.af{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:#3d3d46}
.pvs-card label.af input{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:15px;font-weight:400;background:#fff;color:var(--ink);width:100%;margin:0}
.pvs-card label.af input:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:transparent}
.pvs-card .pw-wrap{position:relative}
.pvs-card .pw-wrap input{padding-right:44px}
.pvs-card .pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;color:#8a8a94;cursor:pointer;display:grid;place-items:center;border-radius:8px;padding:0}
.pvs-card .pw-eye:hover{color:var(--ink);background:var(--bg)}
.pvs-card .pw-eye.on{color:var(--pri)}
.pvs-card .go{height:44px;border:0;border-radius:10px;background:linear-gradient(135deg,#2f84d4 0%,#5a5fbb 100%);color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;width:100%}
.pvs-card .go:disabled{opacity:.6;cursor:default}
.pvs-card .or-line{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin:2px 0}
.pvs-card .or-line:before,.pvs-card .or-line:after{content:"";flex:1;height:1px;background:var(--line)}
.pvs-card .pv-sso{height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-weight:600;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.pvs-card .pv-sso:hover{background:var(--bg)}
.pvs-card .alinks{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pvs-card .alinks button{border:0;background:none;font:inherit;font-weight:600;font-size:13.5px;color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer}
.pvs-card .alinks button:hover{background:var(--bg)}
.pvs-card .notice{background:#edf2fd;border:1px solid #cbd8f6;color:#213f8a;padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.4}
.pvs-card .notice.bad{background:#fef0ef;border-color:#f7c6c2;color:#a3231a}
.pvs-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.pvs-pick button{border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;text-align:left;padding:13px 14px;cursor:pointer;display:block}
.pvs-pick button:hover{background:var(--bg)}
.pvs-pick button b{display:block;font-size:15px}
.pvs-pick button span{color:var(--mut);font-size:13px}
@media (max-width:1300px) and (min-width:821px){.pvs-mock{width:300px}}
@media (max-width:820px){.pvs-auth{grid-template-columns:1fr}.pvs-art{display:none}.pvs-form{padding:24px 14px;align-content:start;min-height:100vh}.pvs-card{padding:26px 20px;border-radius:18px;margin-top:4vh}.pvs-card label.af input{font-size:16px}.pvs-card .pvs-brand .pvword{font-size:17px}}
@media (max-width:380px){.pvs-card .pvs-brand .pvword{font-size:14px;letter-spacing:.1em}}
.pvs-card .plin{font-size:26px;letter-spacing:.35em;text-align:center;padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);width:100%;font-family:inherit}
.pvs-card .plin:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:transparent}
</style>

<script>

/* ---------- roles and features ---------- */
// Standard Proview roles (20 Nov 2026): Admin, Manager, Staff. The business's first person keeps the stored key 'owner'
// (they set up the first PIN and can't be archived) but is an Admin everywhere on screen.
const ROLES=[['admin','Admin'],['manager','Manager'],['member','Staff']];
const roleName=r=>({owner:'Admin',admin:'Admin',manager:'Manager',member:'Staff'}[r]||r);
const FEATS=[['timesheets','Timesheets','Team timesheets, live locations, clock-ins'],['approvals','Approvals','Approve or reopen timesheets'],['rota','Rota','Shifts, cover needs, rota settings'],['tasks','Tasks','Tasks and templates'],['timeoff','Time off','Team leave requests'],['reports','Reports','Reports and exported files'],['payslips','Payslips & P45s','Upload and manage documents'],['people','People','Edit team profiles and send invites'],['ai','Proview AI','Ask questions about the data'],['settings','Settings pages','View settings pages']];
const MGR_DEF=['timesheets','approvals','rota','tasks','timeoff','reports','payslips','people','ai','settings'];
function feat(p,k){ if(!p)return false; if(p.role==='owner'||p.role==='admin')return true; if(p.feats&&p.feats[k]!==undefined)return !!p.feats[k]; return p.role==='manager'&&MGR_DEF.includes(k) }
const isAdmin=p=>p&&(p.role==='owner'||p.role==='admin');
const isMgr=p=>p&&(isAdmin(p)||p.role==='manager');
const isTop=p=>p&&p.role!=='member'; // sees admin-style menu
function managedBy(p){ if(!p)return []; const gs=S.groups.filter(g=>g.mgr===p.id).map(g=>g.id); return S.people.filter(x=>!x.archived&&(gs.includes(x.g)||x.id===p.id)) }
function myLocs(p){ return (!p.locs||p.locs==='all')?S.locations.filter(l=>!l.archived):S.locations.filter(l=>!l.archived&&p.locs.includes(l.id)) }
function team(opts){ // people the viewer may see
  const m=me(); let list=S.people.filter(p=>!p.archived&&!p.noTrack);
  if(!isAdmin(m)){ if(!S.perms.mgrViewAllTimesheets) list=list.filter(p=>managedBy(m).some(x=>x.id===p.id)); }
  const sc=(opts&&opts.scope)||U.scope;
  if(sc==='mine') list=list.filter(p=>managedBy(m).some(x=>x.id===p.id));
  if(sc==='me') list=list.filter(p=>p.id===m.id);
  if(U.loc!=='all') list=list.filter(p=>!p.locs||p.locs==='all'||p.locs.includes(U.loc));
  return list;
}
function canPage(k){ const m=me(); if(!m)return false;
  const ft={timesheets:'timesheets',rota:'rota',tasks:'tasks',live:'timesheets',timeoff:'timeoff',reports:'reports',ai:'ai','s-people':'people','s-users':'people','s-payslips':'payslips','s-tracking':'settings','s-schedules':'settings','s-holidays':'settings','s-locations':'settings','s-projects':'settings','s-company':'settings'}[k];
  if(['locations'].includes(k))return isAdmin(m)&&bizList().length>1;
  if(k==='resolve')return isTop(m)&&(feat(m,'timesheets')||feat(m,'rota')||feat(m,'timeoff')||isAdmin(m));
  if(['start'].includes(k))return isAdmin(m);
  if(k==='start')return isAdmin(m)&&!S.onb.dismissed;
  if(k==='s-company'||k==='s-tracking'||k==='s-schedules')return isAdmin(m)||(m.role==='manager'&&feat(m,'settings'));
  if(['dash'].includes(k))return isTop(m)||feat(m,'timesheets');
  if(k==='timeoff')return true;
  if(k==='mydocs')return !m.noTrack;
  if(k==='docs')return isTop(m)&&(isAdmin(m)||feat(m,'people'));
  if(ft)return feat(m,ft);
  return true;
}
const defaultPage=()=>isTop(me())?'dash':'home';

/* Check the numbers first, then download. Totals per person are worked out from the rows themselves. */
function previewCSV(name,rows,kind){
  const nr=rows.length-1, head=rows[0]||[]; const hi=head.findIndex(h=>/^hours?\b/i.test(String(h))), si=head.findIndex(h=>/^status$/i.test(String(h))), oi=head.findIndex(h=>/^clock out$/i.test(String(h))), ii=head.findIndex(h=>/^clock in$/i.test(String(h)));
  const ni=Math.max(0,head.findIndex(h=>/^(member|person|name)$/i.test(String(h)))); let sum='', warn='';
  if(hi>=0&&nr>0){ const m={}, order=[]; let tot=0; rows.slice(1).forEach(r=>{ const k=String(r[ni]||''); const h=parseFloat(r[hi]); if(!(k in m)){ m[k]={h:0,n:0}; order.push(k) } if(!isNaN(h)){ m[k].h+=h; tot+=h } m[k].n++ });
    const hm=h=>fd(Math.round(h*60));
    sum=`<div class="card tw" style="margin-bottom:12px"><table class="t"><thead><tr><th>${esc(head[ni])}</th><th class="r">Lines</th><th class="r">Hours</th><th class="r">Decimal</th></tr></thead><tbody>${order.map(k=>`<tr><td><b>${esc(k)}</b></td><td class="r num">${m[k].n}</td><td class="r num">${hm(m[k].h)}</td><td class="r num">${m[k].h.toFixed(2)}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td class="r num">${nr}</td><td class="r num">${hm(tot)}</td><td class="r num">${tot.toFixed(2)}</td></tr></tfoot></table></div>`;
    const pend=si>=0?rows.slice(1).filter(r=>r[si]==='pending').length:0, open=(oi>=0&&ii>=0)?rows.slice(1).filter(r=>r[ii]&&!r[oi]).length:0;
    if(pend)warn+=`<div class="alert warn" style="margin-bottom:8px"><span>${plural(pend,'line')} still waiting for approval.</span></div>`;
    if(open)warn+=`<div class="alert warn" style="margin-bottom:8px"><span>${plural(open,'line')} with no clock-out yet (still working), so those hours may change.</span></div>`; }
  const show=rows.slice(0,121);
  const tbl=`<details${sum?'':' open'}><summary style="cursor:pointer;margin:4px 0 8px"><b>${sum?'See every line':'Preview'}</b> (${plural(nr,'row')}${nr>120?', first 120 shown':''})</summary><div class="card tw" style="max-height:320px;overflow:auto"><table class="t"><thead><tr>${show[0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${show.slice(1).map(r=>`<tr>${r.map(c=>`<td>${esc(c==null?'':c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
  openPanel({title:'Check before you download',wide:true,saveLabel:'Download',body:`<p class="mut" style="margin-top:0">${esc(name)}. Check the totals first, so you only download once.</p>${warn}${sum}${tbl}`,save:()=>{ exportCSV(name,rows,kind); return true }}) }
async function saveFile(name,data,type){
  let ok=false;
  try{ const d=(window.claude&&claude.use)?await claude.use('downloads'):null; if(d){ await d.save({filename:name,data}); ok=true } }catch(e){ if(e&&(e.code==='declined'||/declin/i.test(String(e.message||e)))){toast('Download cancelled');return} }
  if(!ok){ try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:type||'text/plain'})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{a.remove()},500); ok=true }catch(e){} }
  toast(ok?'Saved '+name:'Could not download. Use Reports, Exported files.'); }

function personPanel(id){ const p=id?P(id):null; const m=me(); const self=p&&p.id===m.id;

s it" autocomplete="off"'))}${lab('Payroll number (optional)',inp('payNo',p?p.payNo||'':'','autocomplete="off"'))}</div></div><div class="psec"><h3 class="sech">Sign-in</h3><div class="f2">${lab('Kiosk code',inp('code',p?p.code:''))}${lab('Sign-in PIN (3 to 6 numbers, only managers can see it)',inp('pin',p?p.pin:'','inputmode="numeric" maxlength="6" pattern="[0-9]*" autocomplete="new-password"'+(payHidden()?' type="password"':'')))}</div>${payHidden()?'<div style="margin:-4px 0 8px"><button type="button" class="btn sm" data-a="secFld">Show PIN and pay</button></div>':''}</div><div class="psec"><h3 class="sech">Working rules</h3>${lab('Start date',inp('start',p?p.start:today(),'type="date"'))}${tgl('track',p?!p.noTrack:true,'Tracks time','Turn off for people who never clock in, such as an owner who only manages.')}${tgl('licensed',p?p.licensed:true,'Licensed','A licence lets them clock in.')}${tgl('flex',p?!!p.flex:false,'Flexible on days','Used to cover gaps on any day when the rota is generated. Leave off for people who work set days.')}${lab('Cannot start before',sel('earliest',[['','Any time (can open)'],['480','08:00'],['540','09:00'],['600','10:00'],['660','11:00'],['720','12:00'],['780','13:00'],['840','14:00'],['900','15:00'],['960','16:00'],['1020','17:00'],['1080','18:00']],p&&p.earliest?String(p.earliest):''))}${note('For someone who cannot do openings or only works later or evenings. The rota will never give them a start earlier than this.')}<h3 style="margin-top:12px">Activities</h3>${note('Tick the activities this person can use. They show on their own app.')}${cks('acts',S.activities.filter(x=>!x.archived).map(x=>[x.id,x.name]),p?actsFor(p).map(x=>x.id):S.activities.filter(x=>!x.archived&&!(x.assign&&x.assign.length)).map(x=>x.id))}</div>`,
    left:p&&!self&&p.role!=='owner'?`<button class="btn danger" data-a="archPerson" data-id="${p.id}">Archive</button>`:'',
    save:v=>{ if(!v.name.trim()){toast('Enter a name');return false} if(v.pin&&!/^\d{3,6}$/.test(v.pin)){toast('PIN must be 3 to 6 digits');return false}
      const rec={name:v.name.trim(),email:v.email.trim(),phone:v.phone.trim(),g:v.g,sched:v.sched,rate:Number(v.rate)||0,contract:Math.max(0,Number(v.contract)||0),payName:(v.payName||'').trim(),payNo:(v.payNo||'').trim(),otp:v.otp||'',code:v.code.trim(),pin:(v.pin.trim()||(!p&&v.role!=='owner'?newPin():'')),start:v.start||today(),noTrack:!v.track,licensed:!!v.licensed,flex:!!v.flex,earliest:Number(v.earliest)||0,act:v.act||'',act2:(v.act2&&v.act2!==v.act)?v.act2:''};

      const keep=[]; const pid=p?p.id:S.people[S.people.length-1].id; const want=new Set(v.acts||[]); [v.act,v.act2].filter(Boolean).forEach(i=>want.add(i)); const everyone=S.people.filter(x=>!x.archived&&!x.noTrack).map(x=>x.id);

A.pinAll=()=>{ const need=S.people.filter(p=>!p.archived&&!p.pin&&p.licensed!==false&&p.role!=='owner'); if(!need.length){ toast('Everyone already has a PIN.'); return }
  const used=new Set(S.people.map(p=>p.pin).filter(Boolean)); const out=[];

/* ----- schematic map (no street tiles in this version) ----- */
function schemMap(items,locs){ // items: [{x:lat,y:lng,label,color}], locs: with radius
  const pts=locs.filter(l=>l.lat!=null&&l.lng!=null).map(l=>({...l,t:'l'})).concat(items.filter(i=>i.lat!=null).map(i=>({...i,t:'p'})));
  if(!pts.length)return `<div class="map"><div class="empty"><b>No coordinates yet</b>Add a latitude and longitude to a location (or use "Use my current location") to see it here.</div></div>`;
  const W=800,H=340, mlat=(Math.min(...pts.map(p=>p.lat))+Math.max(...pts.map(p=>p.lat)))/2, mlng=(Math.min(...pts.map(p=>p.lng))+Math.max(...pts.map(p=>p.lng)))/2, k=Math.cos(mlat*Math.PI/180);
  const X=p=>(p.lng-mlng)*111320*k, Y=p=>-(p.lat-mlat)*111320; const xs=pts.map(X), ys=pts.map(Y);
  const rmax=Math.max(0,...locs.map(l=>l.radius||0)); const spanX=Math.max(...xs)-Math.min(...xs)+2*Math.max(rmax,150), spanY=Math.max(...ys)-Math.min(...ys)+2*Math.max(rmax,150);
  const sc=Math.min(W/spanX,H/spanY), cx=(Math.max(...xs)+Math.min(...xs))/2, cy=(Math.max(...ys)+Math.min(...ys))/2; const px=p=>W/2+(X(p)-cx)*sc, py=p=>H/2+(Y(p)-cy)*sc;
  const grid=[...Array(9)].map((_,i)=>`<line x1="${i*100}" y1="0" x2="${i*100}" y2="${H}" stroke="currentColor" opacity=".07"/>`).join('')+[...Array(4)].map((_,i)=>`<line x1="0" y1="${i*100}" x2="${W}" y2="${i*100}" stroke="currentColor" opacity=".07"/>`).join('');
  const bar=Math.pow(10,Math.floor(Math.log10(150/sc))), bw=bar*sc;
  return `<div class="map"><svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Schematic map of locations and people">${grid}${locs.filter(l=>l.lat!=null).map(l=>`<circle cx="${px(l)}" cy="${py(l)}" r="${Math.max(6,(l.radius||0)*sc)}" fill="var(--pri)" fill-opacity=".1" stroke="var(--pri)" stroke-dasharray="5 4"/><path transform="translate(${px(l)-9} ${py(l)-24})" d="M9 22s7-6 7-11a7 7 0 10-14 0c0 5 7 11 7 11z" fill="var(--bad)"/><circle cx="${px(l)}" cy="${py(l)-13}" r="2.6" fill="#fff"/><text x="${px(l)}" y="${py(l)+16}" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">${esc(l.name)}</text>`).join('')}${items.filter(i=>i.lat!=null).map(i=>`<g><circle cx="${px(i)}" cy="${py(i)}" r="13" fill="${i.color}" stroke="#fff" stroke-width="2"/><text x="${px(i)}" y="${py(i)+4}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">${esc(i.label)}</text></g>`).join('')}<g transform="translate(16 ${H-18})"><rect width="${bw}" height="4" fill="currentColor" opacity=".6"/><text y="-5" font-size="11" fill="currentColor">${bar>=1000?bar/1000+' km':bar+' m'}</text></g></svg></div><p class="mut" style="font-size:12px;margin:6px 0 0">Schematic map. Street maps need the online version.</p>` }

A.tkTog=d=>{ const t=S.tasks.find(x=>x.id===d.id); if(!t)return; { const dn=d.pid?taskDoneBy(t,d.d,d.pid):taskState(t,d.d)==='done'; if(!dn&&t.needPh&&!tkPhotosOf(t,d.d).length){ toast('Add a photo first, then mark it done.'); if(!PN)A.tkOpen(d); return } } taskCheck(t,d.d,d.pid||(t.asg.mode==='person'?t.asg.pid:null)||(taskAssignees(t,d.d)[0])||null); commit() };

;white-space:normal;max-width:120px;font-size:10.5px">${iss.filter(x=>x.hard).slice(0,2).map(x=>DN[dow(x.d)]+' '+pd(x.d).getDate()+': '+esc(x.t)).join('<br>')}</span>`:''}</td></tr>`).join('');

  return tiles+(rows.length?`<div class="card tw"><table class="t"><thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>`:`<div class="card">${empty('Nobody to show','Try another group, location or view.')}</div>`)+`<p class="mut" style="margin-top:8px">Tap a day to see or fix the clock-ins.${pay?' Showing payroll hours (rounding and automatic breaks applied).':''}</p>` }
function dayBody(){ const pay=!!U.t.payroll; const day=U.t.tsd||today(); const list=tsList();
  const rows=list.map(p=>({p,dc:dayCalc(p,day,pay),pl:planned(p,day),st:(()=>{const es=entFilter(p.id,day); if(!es.length)return 'none'; if(es.some(e=>e.st==='rejected'))return 'rejected'; return es.every(e=>e.st==='approved')?'approved':'pending'})(),leave:leaveOn(p.id,day)}));

function pendWhy(p,ws){ const iss=wkIssues(p,ws).filter(x=>x.hard); if(iss.length)return {k:'bad',t:'Cannot approve yet: '+iss.map(x=>DN[dow(x.d)]+' '+pd(x.d).getDate()+' '+x.t).join(', ')+'.'}; if(addD(ws,6)>=today())return {k:'ok',t:'Nothing is wrong. It is pending because nobody has approved it yet, and the week is still running (ends '+fdate(addD(ws,6))+'), so more hours may be added.'}; return {k:'ok',t:'Nothing is wrong. It is pending only because nobody has approved it yet.'} }
A.weekDetail=d=>{ const p=P(d.pid); const ws=d.ws; const es=wkEntries(p.id,ws).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.in||0)-(b.in||0)); const w=weekCalc(p,ws,false); const st=weekStatus(p,ws); const canAp=feat(me(),'approvals');
  openPanel({title:p.name,nofoot:true,wide:true,body:`<p class="mut" style="margin:0 0 10px">Week of ${fdy(ws)} · ${stTag(st)}</p>${st==='pending'?(()=>{ const w2=pendWhy(p,ws); return `<div class="alert ${w2.k==='bad'?'warn':'info'}" style="margin-bottom:10px"><span><b>Why pending?</b> ${esc(w2.t)}</span></div>` })():''}<div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="card stat"><small>Total</small><b style="font-size:20px">${fd(w.worked)}</b></div><div class="card stat"><small>Regular</small><b style="font-size:20px">${fd(w.reg)}</b></div>${otOn()?`<div class="card stat"><small>Overtime</small><b style="font-size:20px">${fd(w.ot)}</b></div>`:''}</div><div class="card" style="margin-top:12px">${es.map((e,i)=>{ const first=i===0||es[i-1].date!==e.date; let h=''; if(first){ const dc=dayCalc(p,e.date,false); const di=dayIssues(p,e.date); h=`<div style="padding:6px 16px 0"><small><b>${fdate(e.date)}</b> <span class="mut">· break ${dc.brk?fd(dc.brk):'none'}</span> ${di.map(issChip).join(' ')}</small></div>` } return h+entRow(e) }).join('')||empty('No entries this week')}</div>${canAp&&es.length?`<div class="row" style="margin-top:12px">${st==='approved'?`<button class="btn" data-a="apprv" data-pid="${p.id}" data-ws="${ws}" data-to="pending">Reopen timesheet</button>`:`<button class="btn bad" data-a="rejAsk" data-pid="${p.id}" data-ws="${ws}">Reject</button><button class="btn pri" data-a="apprv" data-pid="${p.id}" data-ws="${ws}" data-to="approved">Approve</button>`}</div>`:''}`}) };

function apprView(){ const ws=U.t.apw||wkStart(today()); const f=cur('apf','pending'); const all=team().map(p=>({p,st:weekStatus(p,ws),w:weekCalc(p,ws,false),n:wkEntries(p.id,ws).length})).filter(r=>r.n);

/* ===== plan A: rota ===== */
const shEnd=s=>s.end<=s.start?s.end+1440:s.end;
const shLen=s=>shEnd(s)-s.start;
const shMin=s=>s.ne?0:Math.max(0,shLen(s)-(s.brk||0));
const shActName=s=>{ if(!s.act)return ''; if(s.pid){ const pp=P(s.pid); if(pp&&s.act===defaultAct(pp))return '' } return aname(s.act)||'' };
const shRng=(s,sep)=>s.ne?'from '+fT(s.start):fT(s.start)+(sep||'–')+fT(s.end);
const otLimit=p=>{ if(!otOn())return Infinity; const o=otFor(p,sched(p)); return o.weekly&&o.weekly.on?o.weekly.h*60:Infinity };
const dayLimit=p=>{ if(!otOn())return Infinity; const o=otFor(p,sched(p)); return o.daily&&o.daily.on?o.daily.h*60:Infinity };
const wkShifts=ws=>S.shifts.filter(s=>s.date>=ws&&s.date<=addD(ws,6)&&(U.loc==='all'||!s.loc||s.loc===U.loc));
const sortSh=a=>a.slice().sort((x,y)=>x.start-y.start);
const HOLP={id:'-'};
function covCount(r,d){ const f=mins(r.from),t0=mins(r.to),t=t0<=f?t0+1440:t0; return S.shifts.filter(s=>s.date===d&&(!r.loc||s.loc===r.loc)&&s.start<=f&&shEnd(s)>=t&&(!r.g||!s.pid||(P(s.pid)||{}).g===r.g)).length }
function covApplies(r,d){ if(!r.days.includes(dow(d)))return false; if(holName(d,HOLP)&&!r.hol)return false; return true }

function rotaPeople(){ let l=team(); const g=U.t.rgp||'all'; if(g!=='all')l=l.filter(p=>p.g===g); return grpSort(l) }
function deptCard(ws,shs){ const admin=isAdmin(me()); const vis=new Set(team().map(p=>p.id)); const rows=[]; const mk=(name,list)=>{ const hrs=sum(list,shMin); const cost=sum(list,x=>shMin(x)/60*((P(x.pid)||{}).rate||0)); return {name,n:new Set(list.map(x=>x.pid)).size,hrs,cost,sh:list.length} };
  S.groups.forEach(g=>{ const list=shs.filter(x=>x.pid&&vis.has(x.pid)&&(P(x.pid)||{}).g===g.id); rows.push(mk(g.name,list)) });
  const ng=shs.filter(x=>x.pid&&vis.has(x.pid)&&!G((P(x.pid)||{}).g)); if(ng.length)rows.push(mk('No department',ng));
  const op=shs.filter(x=>!x.pid); const all=shs.filter(x=>x.pid&&vis.has(x.pid)); const tot=mk('Total',all);
  if(!all.length&&!op.length)return '';
  const body=rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td class="r num">${r.n}</td><td class="r num"><b>${fd(r.hrs)}</b></td>${admin?`<td class="r num"><b>${money(r.cost)}</b></td>`:''}</tr>`).join('');
  const openRow=op.length?`<tr><td class="mut">Open shifts (nobody yet)</td><td class="r num mut">–</td><td class="r num mut">${fd(sum(op,shMin))}</td>${admin?'<td class="r num mut">–</td>':''}</tr>`:'';
  return `<div class="card tw dept" style="margin-bottom:14px"><div class="hd"><h2>By department</h2></div><table class="t"><thead><tr><th>Department</th><th class="r">People</th><th class="r">Hours</th>${admin?'<th class="r">Cost</th>':''}</tr></thead><tbody>${body}${openRow}<tr style="border-top:2px solid var(--line)"><td><b>Total</b></td><td class="r num"><b>${tot.n}</b></td><td class="r num"><b>${fd(tot.hrs)}</b></td>${admin?`<td class="r num"><b>${money(tot.cost)}</b></td>`:''}</tr></tbody></table></div>` }
V.rota=()=>{ const ws=U.t.rw||wkStart(today()); const days=weekDays(ws); const ppl=rotaPeople(); const shs=wkShifts(ws); const drafts=shs.filter(s=>!s.pub&&s.date>=today()).length; const opens=shs.filter(s=>!s.pid); const assigned=shs.filter(s=>s.pid); const hrs=sum(assigned,shMin); const cost=sum(assigned,s=>shMin(s)/60*((P(s.pid)||{}).rate||0)); const grp=U.t.rgp||'all';
  const mine=ppl.map(p=>({p,l:sortSh(shs.filter(s=>s.pid===p.id))}));
  const head=`<tr><th class="stk">Member</th>${days.map(d=>`<th class="${d===today()?'tod':''}">${DN[dow(d)]} ${pd(d).getDate()}${holName(d,HOLP)?`<br><span class="chip amber" style="font-weight:600">${esc(holName(d,HOLP))}</span>`:''}</th>`).join('')}<th class="r">Week</th></tr>`;
  const cell=(p,d,l)=>{ const lv=p&&leaveOn(p.id,d,true); const tot=p?sum(shs.filter(s=>s.pid===p.id),shMin):0; const over=p&&tot>otLimit(p);
    return `<td class="${d===today()?'tod':''}">${l.map(s=>`<button class="shift ${s.pid?'':'open'} ${(s.pub||s.date<today())?'':'draft'} ${over?'ot':''}" data-a="shiftEdit" data-id="${s.id}">${shRng(s)}${(()=>{ const x=shActName(s); const loc=S.locations.filter(l=>!l.archived).length>1?lname(s.loc):''; const t=[loc,x].filter(Boolean).join(' · '); return t?`<small>${esc(t)}</small>`:'' })()}${s.note?`<small>${esc(s.note)}</small>`:''}</button>`).join('')}${lv?`<span class="chip purple" style="margin-bottom:3px">${lv.st==='pending'?'Leave?':'Leave'}</span>`:''}${l.length||lv?'':`<button class="addc" data-a="shiftNew" data-pid="${p?p.id:''}" data-d="${d}" aria-label="Add shift">${ic('plus')}</button>`}</td>` };
  const openRow=`<tr class="orow"><td class="stk"><div class="who"><span class="av sm" style="background:var(--bad)">${ic('alert')}</span><div><b>Open shifts</b><small>${plural(opens.length,'shift')} unassigned</small></div></div></td>${days.map(d=>cell(null,d,sortSh(opens.filter(s=>s.date===d)))).join('')}<td class="r num">${fd(sum(opens,shMin))}</td></tr>`;

  if(leaveOn(s.pid,s.date,true))w.push(p.name+' has time off on '+fdate(s.date)+'.'); if(avOn(s.pid,s.date,'cant'))w.push(p.name+' told you they cannot work '+fdate(s.date)+'.');
  const prev=others.filter(x=>x.date===addD(s.date,-1)).map(x=>shEnd(x)-1440).sort((x,y)=>y-x)[0]; if(prev!=null&&a-prev<R.minRest*60)w.push('Less than '+R.minRest+' hours rest since the previous shift.');
  const next=others.filter(x=>x.date===addD(s.date,1)).map(x=>x.start+1440).sort((x,y)=>x-y)[0]; if(next!=null&&next-b<R.minRest*60)w.push('Less than '+R.minRest+' hours rest before the next shift.');
  const ws=wkStart(s.date); const wk=S.shifts.filter(x=>x.pid===s.pid&&x.id!==s.id&&x.date>=ws&&x.date<=addD(ws,6)); const dset=new Set(wk.map(x=>x.date)); dset.add(s.date); if(dset.size>R.maxDays)w.push(p.name+' would work '+dset.size+' days this week (limit '+R.maxDays+').');
  if(sum(wk,shMin)+shMin(s)>otLimit(p))w.push('This takes '+p.name+' over the weekly overtime limit.');

/* ----- auto-generate ----- */
function usualFor(p,d){ const sc=SC(p.sched); if(!sc||p.flex||p.noTrack||!p.licensed||!sc.days)return null; const c=sc.days[dow(d)]; if(!c||!c.on||!c.from)return null; const f=mins(c.from),e=mins(c.to); return {f,e,brk:((e<=f?e+1440:e)-f>=360)?unpaidBrk(sc):0,act:c.act||''} }
function askNote(r,d,folk){ const c=coverFor(d,r.act||'').filter(x=>!r.g||r.act||x.p.g===r.g); return 'Needs cover'+(c.length?'. Could ask: '+c.slice(0,5).map(x=>x.p.name+(x.vol?' (said they can)':'')).join(', '):'') }
function autoRota(ws){ const R=S.rotaRules; const days=weekDays(ws); const folk=S.people.filter(p=>!p.archived&&!p.noTrack&&p.licensed); let made=0,filled=0,open=0;
  const wkOf=p=>S.shifts.filter(s=>s.pid===p.id&&s.date>=ws&&s.date<=addD(ws,6));
  const c4=(p,fn)=>S.shifts.filter(s=>s.pid===p.id&&s.date>=addD(ws,-21)&&s.date<=addD(ws,6)&&fn(s)).length;
  const ok=(p,d,f,t0,brk,loc)=>{ const t=t0<=f?t0+1440:t0; const net=Math.max(0,t-f-(brk||0)); const mine=S.shifts.filter(s=>s.pid===p.id);
    if(mine.some(s=>s.date===d))return false; if(p.earliest&&f<p.earliest)return false; if(leaveOn(p.id,d,true))return false; if(avOn(p.id,d,'cant'))return false; const vol=!!avOn(p.id,d,'can'); if(!vol&&R.fixed&&!p.flex&&isRest(p,d))return false; if(!vol&&isRest(p,d)&&R.avoidOT&&((sched(p).ot||defOT()).rest||{}).on)return false; if(loc&&!myLocs(p).some(l=>l.id===loc))return false;
    const wk=wkOf(p); if(new Set(wk.map(s=>s.date).concat([d])).size>R.maxDays)return false;
    const pv=mine.filter(s=>s.date===addD(d,-1)).map(s=>shEnd(s)-1440).sort((x,y)=>y-x)[0]; if(pv!=null&&f-pv<R.minRest*60)return false;
    const nx=mine.filter(s=>s.date===addD(d,1)).map(s=>s.start+1440).sort((x,y)=>x-y)[0]; if(nx!=null&&nx-t<R.minRest*60)return false;
    if(R.avoidOT&&(sum(wk,shMin)+net>otLimit(p)||net>dayLimit(p)))return false; return true };
  const rank=(cands,d,f,t0)=>{ const we=dow(d)>=5, late=(t0>=1200||f>=900||t0<=f); return by(cands,p=>{ const wm=sum(wkOf(p),shMin); const k=R.fair?(we?c4(p,s=>dow(s.date)>=5):late?c4(p,s=>s.end>=1200||s.start>=900||s.end<=s.start):0):0; return (avOn(p.id,d,'can')?'0':'1')+String(k).padStart(3,'0')+String(Math.round(wm)).padStart(5,'0')+p.name }) };
  // 0. start from each person's usual week (their set days and start times), skipping anyone who is off
  let kept=0; if(R.usual){ folk.forEach(p=>{ if(p.flex)return; days.forEach(d=>{ const u=usualFor(p,d); if(!u)return; if(p.earliest&&u.f<p.earliest)return; if(S.shifts.some(x=>x.pid===p.id&&x.date===d))return; if(leaveOn(p.id,d,true)||avOn(p.id,d,'cant')){kept++;return}
      S.shifts.push({id:uid(),pid:p.id,date:d,start:u.f,end:u.e,ne:S.rotaRules.noEnd!==false,brk:u.brk,act:u.act||defaultAct(p),loc:(myLocs(p)[0]||S.locations[0]||{}).id,note:'',pub:false}); made++ }) }) }
  // 1. fill open shifts
  S.shifts.filter(s=>!s.pid&&s.date>=ws&&s.date<=addD(ws,6)&&(U.loc==='all'||!s.loc||s.loc===U.loc)).forEach(s=>{ const c=rank(folk.filter(p=>canDo(p,s.act)&&ok(p,s.date,s.start,s.end,s.brk,s.loc)),s.date,s.start,s.end)[0]; if(c){ s.pid=c.id; s.pub=false; filled++ } });
  // 2. meet cover needs (weekends first, they are hardest to staff)
  const order=days.slice().sort((a,b)=>(dow(a)>=5?0:1)-(dow(b)>=5?0:1)||(a<b?-1:1));
  order.forEach(d=>S.cover.forEach(r=>{ if(!covApplies(r,d))return; const f=mins(r.from),t0=mins(r.to),brk=((t0<=f?t0+1440:t0)-f>=360)?(r.brkN||0)*(r.brkM||0):0; let need=r.n-covCount(r,d);
    while(need-->0){ const c=rank(folk.filter(p=>(r.act?canDo(p,r.act):(!r.g||p.g===r.g))&&ok(p,d,f,t0,brk,r.loc)),d,f,t0)[0]; S.shifts.push({id:uid(),pid:c?c.id:null,date:d,start:f,end:t0,ne:S.rotaRules.noEnd!==false,brk,act:r.act||'',loc:r.loc||(S.locations[0]||{}).id,note:c?'':askNote(r,d,folk),pub:false}); if(c)made++; else open++ } }));
  return {made,filled,open,kept} }
A.rotaAuto=()=>{ const ws=U.t.rw||wkStart(today()); if(!S.cover.length&&!S.rotaRules.usual){toast('Add cover needs first, so I know how many people you need.');A.rotaRules();return}
  const R=S.rotaRules;

function autoPrep(){ try{ if(S.rotaAuto===false)return; const m=me(); if(!m||!isTop(m)||!feat(m,'rota'))return; const t=today(); if(dow(t)<5)return; const nw=addD(wkStart(t),7); S.ui=S.ui||{}; if(S.ui.prepWk===nw)return; S.ui.prepWk=nw;
  if(S.shifts.some(x=>x.date>=nw&&x.date<=addD(nw,6))||(!S.cover.length&&!S.rotaRules.usual)){ save(); return }
  const r=autoRota(nw); if(!(r.made||r.filled)){ save(); return }
  S.people.filter(p=>!p.archived&&isTop(p)&&feat(p,'rota')).forEach(p=>notify(p.id,'Next week\'s rota ('+fdm(nw)+' to '+fdm(addD(nw,6))+') is ready as a draft. Check it, then publish.','rota'));
  commit(); setTimeout(()=>toast('Next week\'s rota is ready as a draft. Check it, then publish.'),300) }catch(e){} }

   S.avail = [{id,pid,date,kind:'can'|'cant',note,ts}]  what staff have told their manager
   p.act = main role (an activity), p.act2 = optional second role. Only people with the same role cover each other. */

const avCut=()=>S.availCut||{on:true,day:5,time:'00:00'};
function avCutAt(d){ const c=avCut(); const w=addD(wkStart(d),-7+(Number(c.day)||0)); const m=mins(c.time||'00:00')||0; const dt=pd(w); return new Date(dt.getFullYear(),dt.getMonth(),dt.getDate(),0,m).getTime() }
function avLocked(d){ const c=avCut(); return !!c.on&&Date.now()>=avCutAt(d) }
const avCutTxt=d=>{ const t=avCutAt(d); const x=new Date(t); return DN[(x.getDay()+6)%7]+' '+x.getDate()+' '+MN[x.getMonth()]+' at '+pad(x.getHours())+':'+pad(x.getMinutes()) };
const avOn=(pid,d,kind)=>avList().find(a=>a.pid===pid&&a.date===d&&a.kind===kind&&a.st!=='declined');
const mgrRota=()=>{ const m=me(); return isAdmin(m)||(m.role==='manager'&&feat(m,'rota')) };
const shiftRole=s=>{ const p=s.pid&&P(s.pid); return p?defaultAct(p):(s.act||'') };
function coverFor(d,role,exceptPid){ // people who could take a shift on day d, same role only; people who said they can come first
  return S.people.filter(p=>!p.archived&&!p.noTrack&&p.licensed&&p.id!==exceptPid&&canDo(p,role)&&!S.shifts.some(s=>s.pid===p.id&&s.date===d)&&!leaveOn(p.id,d,true)&&!avOn(p.id,d,'cant'))
    .map(p=>({p,vol:!!avOn(p.id,d,'can'),off:!p.flex&&isRest(p,d)}))
    .sort((a,b)=>(b.vol-a.vol)||(a.off-b.off)||(a.p.name<b.p.name?-1:1)) }
const covTag=x=>x.vol?'said they can':x.off?'usually off':'free';

/* ----- understanding a sentence ----- */
const MON3=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const WDX=[['mon','monday'],['tue','tues','tuesday'],['wed','weds','wednesday'],['thu','thur','thurs','thursday'],['fri','friday'],['sat','saturday'],['sun','sunday']];
const avNorm=t=>' '+String(t||'').toLowerCase().replace(/[‘’]/g,"'").replace(/[,.!?;]/g,' ')+' ';
function avDates(txt){ const s=avNorm(txt), t=today(), out=[]; const add=d=>{ if(d&&d>=t&&!out.includes(d))out.push(d) };
  const mk=(day,mo)=>{ if(mo<0||mo>11||day<1||day>31)return null; let y=Number(t.slice(0,4)); let d=new Date(y,mo,day); if(d.getDate()!==day)return null; if(ds(d)<t)d=new Date(y+1,mo,day); return ds(d) };
  let m; const mr='(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*';
  const r1=new RegExp('\\b(\\d{1,2})(?:st|nd|rd|th)?\\s*(?:of\\s+)?'+mr+'\\b','g'); while((m=r1.exec(s)))add(mk(+m[1],MON3.indexOf(m[2])));
  const r2=new RegExp('\\b'+mr+'\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b','g'); while((m=r2.exec(s)))add(mk(+m[2],MON3.indexOf(m[1])));
  const r3=/\b(\d{1,2})\/(\d{1,2})\b/g; while((m=r3.exec(s)))add(mk(+m[1],+m[2]-1));
  if(/\btoday\b/.test(s))add(t); if(/\btomorrow\b/.test(s))add(addD(t,1));
  const nextWk=/\bnext week\b/.test(s), base=wkStart(t);
  const wdRe=new RegExp('\\b(next\\s+|this\\s+|on\\s+|every\\s+)?('+WDX.map(a=>a.slice().reverse().join('|')).join('|')+')\\b','g');
  const one=(i,nx)=>{ let d=addD(base,i); if(nx||nextWk)d=addD(d,7); else if(d<t)d=addD(d,7); add(d) };
  while((m=wdRe.exec(s))){ const i=WDX.findIndex(a=>a.includes(m[2])); if(i>=0)one(i,/next/.test(m[1]||'')) }
  if(/\bweekend\b/.test(s)){ one(5,false); one(6,false) }
  return out.sort() }
function avWho(txt,m){ const s=avNorm(txt); const hit=S.people.filter(p=>!p.archived&&p.name.trim()).filter(p=>{ const f=p.name.trim().split(/\s+/)[0].toLowerCase().replace(/[^a-z0-9]/g,''); return f.length>1&&new RegExp('\\b'+f+"(?:'s)?\\b").test(s) });
  if(!hit.length&&/\b(i|i'm|im|i've|me|my)\b/.test(s))return [m]; return hit }
const NEGRE=/\b(can'?t|cant|cannot|can not|unable|not able|unavailable|not available|won'?t be able|wont be able|isn'?t able|not coming|off sick|sick|ill|not in)\b/;
const POSRE=/\b(can|could|able|available|happy to|willing|free|volunteer|up for)\b/;
const avIntent=t=>{ const s=avNorm(t); return NEGRE.test(s)?'cant':POSRE.test(s)?'can':'' };
function avTime(txt,fallback){ const s=avNorm(txt); let m=s.match(/\b(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)\b/); if(m){ let h=+m[1]%12; if(m[3]==='pm')h+=12; return h*60+(+m[2]||0) }
  m=s.match(/\b(?:at|from|@|starting|start)\s+(\d{1,2})(?:[:.](\d{2}))?\b(?!\s*(?:st|nd|rd|th|\/|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec))/); if(m){ let h=+m[1]; if(h>=1&&h<=5)h+=12; if(h<24)return h*60+(+m[2]||0) } return fallback }

/* ----- saving what people say ----- */
function avApply(p,kind,dates,note,self,sw){ const L=avList();
  dates.forEach(d=>{ for(let i=L.length-1;i>=0;i--)if(L[i].pid===p.id&&L[i].date===d)L.splice(i,1); L.push({id:uid(),pid:p.id,date:d,kind,note:note||'',ts:Date.now(),st:(p.id===me().id&&!mgrRota())?'pending':'approved',sw:sw||undefined}) });
  if(self){ const g=G(p.g); const to=uniq([g&&g.mgr].filter(Boolean).concat(S.people.filter(x=>x.role==='owner'||x.role==='admin').map(x=>x.id))).filter(i=>i!==p.id);
    to.forEach(i=>notify(i,p.name+(kind==='can'?' can work ':' cannot work ')+dates.map(fdate).join(', ')+(note?' ('+note+')':''),'leave')) } }
function avSnap(){ const id=uid(); U.aiUndo={id,shifts:JSON.stringify(S.shifts),avail:JSON.stringify(avList())}; return id }
const undoBtn=id=>`<button class="btn sm" data-a="aiUndo" data-id="${id}">Undo</button>`;
A.aiUndo=d=>{ if(!U.aiUndo||U.aiUndo.id!==d.id){toast('Only the latest change can be undone.');return} S.shifts=JSON.parse(U.aiUndo.shifts); S.avail=JSON.parse(U.aiUndo.avail); U.aiUndo=null; commit(); toast('Undone') };
const shT=s=>shRng(s,' to ');
function giveBtns(s,d,exc){ const role=shiftRole(s); const c=coverFor(d,role,exc).slice(0,6);
  return (c.length?`<div class="row" style="flex-wrap:wrap;gap:6px;margin:6px 0">${c.map(x=>`<button class="btn sm ${x.vol?'pri':''}" data-a="aiGive" data-sid="${s.id}" data-pid="${x.p.id}">${esc(x.p.name.split(' ')[0])} · ${covTag(x)}</button>`).join('')}</div>`:`<p class="mut" style="margin:6px 0">Nobody${role?' with the '+esc(roleNm(role))+' role':''} is free that day.</p>`)+`<button class="btn sm pri" data-a="aiAlert" data-sid="${s.id}">Alert the team to cover</button> <button class="btn sm" data-a="aiOpen" data-sid="${s.id}">Leave it open</button>` }
A.aiGive=d=>{ const s=S.shifts.find(x=>x.id===d.sid), p=P(d.pid); if(!s||!p)return; s.pid=p.id; s.pub=false; s.note=''; if(p.id!==me().id)notify(p.id,'You have been given a shift on '+fdate(s.date)+' ('+shRng(s,' to ')+'). It shows on your rota once it is published.','leave'); commit(); toast(p.name.split(' ')[0]+' is on the draft rota. Publish to tell them.') };
const mgrIds=p=>{ const g=G(p.g); return uniq([g&&g.mgr].filter(Boolean).concat(S.people.filter(x=>!x.archived&&(x.role==='owner'||x.role==='admin')).map(x=>x.id))).filter(i=>i!==p.id) };
function startCover(s,reason){ // someone cannot attend: the shift becomes open and everyone with the same role who is free is alerted
  const p=P(s.pid); if(!p)return 0; const role=defaultAct(p), d=s.date, first=p.name.split(' ')[0];
  const an=avOn(p.id,d,'cant'); if(an)an.sid=s.id;
  s.cover={from:p.id,reason:reason||'',ts:Date.now(),open:true}; s.pid=null; if(role)s.act=role; s.note='Cover needed: '+first+' cannot attend';
  const c=coverFor(d,role,p.id); const txt='Cover needed on '+fdate(d)+' ('+shRng(s,' to ')+(role?', '+roleNm(role):'')+'). '+first+' cannot attend. Can you take it? Open Home and tap Take this shift.';
  c.forEach(x=>notify(x.p.id,txt,'cover'));
  mgrIds(p).forEach(i=>notify(i,p.name+' cannot attend '+fdate(d)+' ('+shRng(s,' to ')+')'+(reason?': '+reason:'')+'. '+(c.length?plural(c.length,'teammate')+' alerted to cover it.':'Nobody with the same role is free, so it is an open shift.'),'cover'));
  return c.length }
A.cantAttend=d=>{ const s=S.shifts.find(x=>x.id===d.sid), p=me(); if(!s||s.pid!==p.id)return;
  openPanel({title:'I cannot attend',saveLabel:'Alert the team',small:true,body:`<p style="margin:0 0 10px"><b>${fdl(s.date)}</b><br><span class="mut">${shRng(s,' to ')}${roleNm(defaultAct(p))?' · '+esc(roleNm(defaultAct(p))):''}</span></p>${lab('Reason (optional)',inp('reason','','placeholder="e.g. not feeling well"'))}<p class="mut" style="margin:0">Your manager and teammates with the same role are alerted straight away. The first person to take the shift gets it.</p>`,
    save:v=>{ const sh=S.shifts.find(x=>x.id===s.id); if(!sh||sh.pid!==p.id){toast('That shift has changed.');return false} const r=(v.reason||'').trim(); avApply(p,'cant',[sh.date],r,false); const n=startCover(sh,r); commit(); toast(n?plural(n,'teammate')+' alerted. Your manager has been told.':'Your manager has been told. Nobody with your role is free, so it is an open shift.') }}) };
A.coverTake=async d=>{ if(typeof SYNC!=='undefined'&&SYNC.on){ SYNC.busy=false; await syncPoll() } const s=S.shifts.find(x=>x.id===d.sid), p=me(); if(!s||s.pid||!s.cover||!s.cover.open){toast('Someone has already taken this shift.');return}
  if(!canDo(p,s.act)){toast('This shift is for another role.');return} if(S.shifts.some(x=>x.pid===p.id&&x.date===s.date)){toast('You already have a shift that day.');return} if(leaveOn(p.id,s.date,true)){toast('You have time off that day.');return}
  s.pid=p.id; s.cover.open=false; s.cover.by=p.id; s.note=''; const from=P(s.cover.from); const first=p.name.split(' ')[0];
  if(from)notify(from.id,first+' is covering your shift on '+fdate(s.date)+'.','cover'); mgrIds(p).forEach(i=>notify(i,first+' is covering '+(from?from.name.split(' ')[0]+"'s":'the')+' shift on '+fdate(s.date)+' ('+shRng(s,' to ')+').','cover'));
  const live=typeof SYNC!=='undefined'&&SYNC.on; if(live)SYNC.cond=[{k:'shifts',id:s.id,f:'pid',v:null}];
  commit(); if(live){ save(true); clearTimeout(SYNC.t); let n=0; while(SYNC.busy&&n++<30)await new Promise(r=>setTimeout(r,100)); const res=await syncPush(); if(res==='conflict'){ toast('Someone else has just taken this shift.'); return } }
  toast('It is yours. Thank you!') };
A.aiAlert=d=>{ const s=S.shifts.find(x=>x.id===d.sid); if(!s||!s.pid)return; const n=startCover(s,''); commit(); toast(n?plural(n,'teammate')+' alerted to cover it.':'Nobody with the same role is free. It is an open shift.') };
A.aiOpen=d=>{ const s=S.shifts.find(x=>x.id===d.sid); if(!s)return; s.act=s.act||shiftRole(s); s.pid=null; s.pub=false; s.note='Needs cover'; commit(); toast('Now an open shift') };
A.aiTake=A.aiGive;
A.aiRota=()=>{ U.t.rw=addD(wkStart(today()),7); go('rota'); setTimeout(()=>A.rotaAuto(),250) };
A.aiOpenRota=d=>{ if(d.d)U.t.rw=wkStart(d.d); go('rota') };

/* ----- the assistant understands rota sentences ----- */
function aiAct(q){ const m=me(), s=avNorm(q); const names=avWho(q,m); const dates=avDates(q); const others=names.some(p=>p.id!==m.id);
  const need=()=>others&&!mgrRota()?'Only a manager can change other people\'s rota or availability.':'';
  const ask='Which day? For example: <i>Kamilla can work Sunday</i>.';
  // make a rota
  if(/\b(make|create|generate|build|prepare|draft|do)\b.*\brota\b/.test(s)&&!names.length){ if(!mgrRota())return 'Only a manager can make the rota.'; return `I can build next week's draft from everyone's usual week, time off and what the team has told you.<p style="margin:8px 0 0"><button class="btn pri sm" data-a="aiRota">Make next week's rota</button></p>` }
  // who can cover
  if(/\bwho (can|could|would|might|is (available|free|able))\b/.test(s)||(/\bwho has\b/.test(s)&&dates.length)||/\bcover(ing)? (for )?\w+/.test(s)&&/\bwho\b/.test(s)){
    if(!dates.length)return 'Which day should I look at? For example: <i>Who can cover Sunday?</i>';
    let h=''; dates.slice(0,3).forEach(d=>{ let role='', exc='', head=fdl(d); const subj=names.find(p=>p.id!==m.id)||null;
      if(subj){ const sh=S.shifts.find(x=>x.pid===subj.id&&x.date===d); role=sh?shiftRole(sh):defaultAct(subj); exc=subj.id; head='Cover for '+subj.name.split(' ')[0]+' on '+fdate(d)+(role?' ('+roleNm(role)+')':'') } else head='Free on '+fdate(d);
      const c=coverFor(d,role,exc); h+=`<b>${esc(head)}</b>`+(c.length?aiTbl(['Who','Role','Status'],c.slice(0,10).map(x=>[esc(x.p.name),esc(roleLabel(x.p)),covTag(x)])).replace(/ class="r num"/g,''):'<p class="mut" style="margin:6px 0">Nobody is free that day'+(role?' with that role':'')+'.</p>') });
    return h }
  // cannot work
  if(NEGRE.test(s)&&names.length){ if(!dates.length)return ask; const bad=need(); if(bad)return bad; const p=names[0]; const id=avSnap(); avApply(p,'cant',dates,'',p.id===m.id&&!mgrRota()); save();
    let h=`<b>Noted: ${esc(p.name.split(' ')[0])} cannot work ${dates.map(fdate).join(', ')}.</b> ${undoBtn(id)}`;
    dates.forEach(d=>{ const sh=S.shifts.filter(x=>x.pid===p.id&&x.date===d); sh.forEach(x=>{ h+=`<p style="margin:10px 0 0">${esc(p.name.split(' ')[0])} is on the rota on ${fdate(d)} (${shT(x)}). Who could cover${shiftRole(x)?' ('+esc(roleNm(shiftRole(x)))+')':''}:</p>`+giveBtns(x,d,p.id) }); if(!sh.length)h+=`<p class="mut" style="margin:6px 0 0">She is not on the rota on ${fdate(d)}, so nothing needs changing.</p>` });
    return h.replace(/She is not/g,esc(p.name.split(' ')[0])+' is not') }
  // remove a shift
  if(/\b(remove|delete|cancel|unschedule|drop|take)\b/.test(s)&&/\b(off|from|shift|rota)\b/.test(s)&&names.length&&dates.length){ if(!mgrRota())return 'Only a manager can change the rota.'; const p=names[0]; const id=avSnap(); let n=0; dates.forEach(d=>{ const k=S.shifts.length; S.shifts=S.shifts.filter(x=>!(x.pid===p.id&&x.date===d)); n+=k-S.shifts.length }); save();
    return n?`<b>Removed ${esc(p.name.split(' ')[0])} from ${plural(n,'shift')}</b> (${dates.map(fdate).join(', ')}). ${undoBtn(id)}`:`${esc(p.name.split(' ')[0])} has no shift on ${dates.map(fdate).join(', ')}.` }
  // put someone on a shift
  if(/\b(put|add|schedule|book|roster|assign|give)\b/.test(s)&&names.length&&dates.length&&!POSRE.test(s.replace(/\bcan you\b/,''))){ if(!mgrRota())return 'Only a manager can change the rota.'; const p=names[0]; const id=avSnap(); const done=[], skip=[];
    dates.forEach(d=>{ if(S.shifts.some(x=>x.pid===p.id&&x.date===d)){skip.push(fdate(d)+' (already on)');return} if(leaveOn(p.id,d,true)){skip.push(fdate(d)+' (time off)');return} if(avOn(p.id,d,'cant')){skip.push(fdate(d)+' (said they cannot)');return}
      const u=usualFor(p,d); const a=avTime(q,u?u.f:540); const open=S.shifts.find(x=>!x.pid&&x.date===d&&canDo(p,x.act)); 
      if(open&&avTime(q,-1)<0){ open.pid=p.id; open.pub=false; open.note=''; done.push(fdate(d)+' ('+shRng(open,' to ')+')') }
      else { S.shifts.push({id:uid(),pid:p.id,date:d,start:a,end:(a<1020)?1020:(a+480)%1440,ne:S.rotaRules.noEnd!==false,brk:0,act:defaultAct(p),loc:(myLocs(p)[0]||S.locations[0]||{}).id,note:'',pub:false}); done.push(fdate(d)+' from '+fT(a)) } });
    save(); return (done.length?`<b>${esc(p.name.split(' ')[0])} added on the draft rota:</b> ${esc(done.join(', '))}. ${undoBtn(id)}<p class="mut" style="margin:6px 0 0">Publish the rota when you are happy.</p>`:'')+(skip.length?`<p style="margin:6px 0 0">Skipped: ${esc(skip.join(', '))}.</p>`:'') }
  // can work
  if(POSRE.test(s)&&names.length&&dates.length&&!/\bwho\b/.test(s)){ const bad=need(); if(bad)return bad; const p=names[0]; const id=avSnap(); avApply(p,'can',dates,'',p.id===m.id&&!mgrRota()); save();
    let h=`<b>Noted: ${esc(p.name.split(' ')[0])} can work ${dates.map(fdate).join(', ')}.</b> ${undoBtn(id)}`;
    dates.forEach(d=>{ const mine=S.shifts.find(x=>x.pid===p.id&&x.date===d); if(mine){ h+=`<p class="mut" style="margin:8px 0 0">${esc(p.name.split(' ')[0])} is already on the rota on ${fdate(d)}.</p>`; return }
      const opens=S.shifts.filter(x=>!x.pid&&x.date===d&&canDo(p,x.act)); if(opens.length)h+=`<p style="margin:8px 0 0">There ${opens.length>1?'are open shifts':'is an open shift'} on ${fdate(d)}:</p><div class="row" style="flex-wrap:wrap;gap:6px;margin:6px 0">${opens.map(x=>`<button class="btn sm pri" data-a="aiTake" data-sid="${x.id}" data-pid="${p.id}">Put ${esc(p.name.split(' ')[0])} on (${shRng(x,' to ')})</button>`).join('')}</div>`; else h+=`<p class="mut" style="margin:8px 0 0">I will offer ${esc(p.name.split(' ')[0])} first when a ${esc(roleNm(defaultAct(p))||'')} gap needs filling on ${fdate(d)}.</p>` });
    return h }
  if(NEGRE.test(s)&&names.length&&!dates.length)return ask;
  return null }

/* ----- notes from the team (rota page, time off page) ----- */
function avCard(from,to,title,only){ const ids=new Set(only?[only]:lvPeople().map(p=>p.id)); const l=avList().filter(a=>ids.has(a.pid)&&a.date>=(from||today())&&(!to||a.date<=to)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  if(!l.length)return ''; return `<div class="card" style="margin-bottom:14px"><div class="hd"><h2>${title||'What the team told you'}</h2></div>${l.map(a=>{ const p=P(a.pid)||{name:'?'}; const can=a.kind==='can'; return `<div class="nowc"><div class="who" style="flex:1">${av(p,'sm')}<div><b>${esc(p.name)}</b><small>${fdate(a.date)}${a.note?' · '+esc(a.note):''}</small></div></div><span class="chip ${can?'green':'red'}">${can?'Can work':'Cannot work'}</span>${a.st==='pending'?'<span class="chip amber">'+(mgrRota()?'Needs your answer':'Waiting for manager')+'</span>':a.st==='approved'&&a.by?'<span class="chip green">Approved</span>':a.st==='declined'?'<span class="chip">Declined</span>':''}${can&&mgrRota()?(()=>{ const o=S.shifts.find(x=>!x.pid&&x.date===a.date&&canDo(P(a.pid),x.act)); return o?`<button class="btn sm pri" data-a="aiGive" data-sid="${o.id}" data-pid="${a.pid}">Give shift</button>`:'' })():''}${a.st==='pending'?(mgrRota()?`<button class="btn sm pri" data-a="avYes" data-id="${a.id}">Approve</button><button class="btn sm" data-a="avNo" data-id="${a.id}">Decline</button>`:''):((mgrRota()||a.pid===me().id)?`<button class="btn sm" data-a="avDel" data-id="${a.id}" aria-label="Remove">${ic('trash')}</button>`:'')}</div>` }).join('')}</div>` }
A.avDel=d=>{ const a=avList().find(x=>x.id===d.id); if(!a)return; if(a.st==='pending'){ toast('This has not been answered yet, so it stays on the list until your manager responds.'); return } S.avail=avList().filter(x=>x.id!==d.id); commit() };
function avDecide(id,ok){ if(!mgrRota())return; const a=avList().find(x=>x.id===id); if(!a||a.st!=='pending')return; const p=P(a.pid); if(!p)return; const first=p.name.split(' ')[0], dl=fdate(a.date); let extra='';
  if(a.sw){ const grp=avList().filter(x=>x.sw===a.sw&&x.st==='pending'); const off=grp.find(x=>x.kind==='cant'), on=grp.find(x=>x.kind==='can'); grp.forEach(x=>{ x.st=ok?'approved':'declined'; x.by=me().id; x.at=Date.now() });
    if(!ok&&off){ const s=off.sid&&S.shifts.find(x=>x.id===off.sid); if(s&&!s.pid&&s.cover&&s.cover.open&&s.cover.from===p.id){ s.pid=p.id; s.cover=null; s.note='' } }
    notify(p.id,ok?'Your manager approved your swap: off '+(off?fdate(off.date):'')+', working '+(on?fdate(on.date):'')+' instead.':'Your manager did not approve your swap ('+(off?fdate(off.date):'')+' for '+(on?fdate(on.date):'')+').','cover'); commit(); toast(ok?first+' has been told the swap is approved.':first+' has been told the swap is declined.'); return }
  a.st=ok?'approved':'declined'; a.by=me().id; a.at=Date.now();
  if(!ok&&a.kind==='cant'){ const s=a.sid&&S.shifts.find(x=>x.id===a.sid); if(s){ if(!s.pid&&s.cover&&s.cover.open&&s.cover.from===p.id){ s.pid=p.id; s.cover=null; s.note=''; extra=' You are back on the shift ('+shRng(s,' to ')+').' } else if(s.cover&&s.cover.by){ const b=P(s.cover.by); extra=' '+(b?b.name.split(' ')[0]:'Someone')+' has already taken the shift, so speak to your manager.' } } }
  notify(p.id,ok?(a.kind==='can'?'Your manager accepted that you can work '+dl+'.':'Your manager approved that you cannot work '+dl+'.'):'Your manager did not approve your request for '+dl+'.'+extra,'cover');
  commit(); toast(ok?first+' has been told it is approved.':first+' has been told it is declined.') }
A.avYes=d=>avDecide(d.id,true); A.avNo=d=>avDecide(d.id,false);

const PAL=['#3f5fd0','#12874a','#d9822b','#8a4fd3','#c62a1f','#0e8fa3','#a5a02a','#d34f9c'];
const ago=ts=>{ const m=Math.floor((Date.now()-ts)/60000); if(m<1)return 'Just now'; if(m<60)return m+' min ago'; const h=Math.floor(m/60); if(h<24)return h+' h ago'; const d=Math.floor(h/24); return d===1?'Yesterday':d<7?d+' days ago':fdate(ds(new Date(ts))) };
function entriesIn(people,from,to){ const ids=new Set(people.map(p=>p.id)); return S.entries.filter(e=>ids.has(e.pid)&&e.date>=from&&e.date<=to&&(U.loc==='all'||e.loc===U.loc)) }
function aggBy(ents,fn,pay){ const out={}; ents.forEach(e=>{ const p=P(e.pid); if(!p)return; const m=emin(e,p,!!pay); const k=fn(e,p); const o=out[k]=out[k]||{worked:0,cost:0,n:0}; o.worked+=m.worked; o.cost+=(p.rate||0)*m.worked/60; o.n++ }); return out }

const RP=[['today','Today'],['week','This week'],['lweek','Last week'],['month','This month'],['lmonth','Last month'],['custom','Custom dates']];
function rpRange(){ const k=cur('rpp','week'); const t=today(); const ws=wkStart(t);

  if(k==='lmonth'){ const f=ds(new Date(pd(t).getFullYear(),pd(t).getMonth()-1,1)); return {k,from:f,to:monthEnd(f),label:'Last month'} }
  let a=U.t.rfa||ws, b=U.t.rfb||addD(ws,6); if(b<a)b=a; return {k,from:a,to:b,label:fdy(a)+' – '+fdy(b)} }

V.reports=()=>{ const tab=cur('rp','time'); const nf=S.exports.length;
  return tabs('rp',[['time','Tracked time'],['att','Attendance insights'],['files','Exported files',nf||'']],'time')+(tab==='att'?rpAtt():tab==='files'?rpFiles():rpTime()) };
function rpBar(extra){ const r=rpRange(); return `<div class="bar"><select data-i="rpp" aria-label="Period">${RP.map(([k,l])=>`<option value="${k}"${r.k===k?' selected':''}>${l}</option>`).join('')}</select>${r.k==='custom'?`<input type="date" name="a" value="${r.from}" data-i="rpd" aria-label="From"><input type="date" name="b" value="${r.to}" data-i="rpd" aria-label="To">`:`<span class="mut">${fdm(r.from)} – ${fdy(r.to)}</span>`}<span class="sp"></span>${scopeSeg()}${extra||''}</div>` }
function rpTime(){ const r=rpRange(); const ents=rpEntries(); const g=cur('rpg','mem'); const ppl=rpPeople(); const showCost=isAdmin(me());
  const keyFn={act:e=>e.act||'-',proj:e=>e.proj||'-',loc:e=>e.loc||'-',mem:e=>e.pid,day:e=>e.date}[g];
  const nameFn={act:k=>k==='-'?'No activity':aname(k),proj:k=>k==='-'?'No project':pname(k),loc:k=>k==='-'?'No location':lname(k),mem:k=>(P(k)||{name:'?'}).name,day:k=>fdate(k)}[g];
  const agg=aggBy(ents,keyFn); let arr=Object.entries(agg).map(([k,v])=>({k,...v})); arr=g==='day'?arr.sort((a,b)=>a.k<b.k?-1:1):arr.sort((a,b)=>b.worked-a.worked); const tot=sum(arr,x=>x.worked); const cost=sum(arr,x=>x.cost);
  const noFilter=!(rpF().act||rpF().proj||rpF().loc); const rc=noFilter?rangeCalc(ppl,r.from,r.to,false):null;
  const nMem=uniq(ents.map(e=>e.pid)).length;
  let acc=0; const grad=tot?arr.slice(0,8).map((x,i)=>{ const a=acc/tot*360; acc+=x.worked; return PAL[i%PAL.length]+' '+a+'deg '+(acc/tot*360)+'deg' }).join(','):'';
  const donut=`<div class="donut" style="background:${tot?`conic-gradient(${grad}${arr.length>8?`,var(--line) ${acc/tot*360}deg 360deg`:''})`:'var(--line)'}" role="img" aria-label="Hours split by ${g}"><div><b>${fd(tot)}</b><small class="mut">Total</small></div></div>`;
  const bar=rpBar(`<button class="btn" data-a="rpFilters">${ic('filter')}Filters${rpFcount()?` (${rpFcount()})`:''}</button><button class="btn" data-a="rpExport">${ic('dl')}Export</button>`);
  const tiles=`<div class="stats"><div class="card stat"><small>Total time</small><b>${fd(tot)}</b></div>${rc&&otOn()?`<div class="card stat"><small>Overtime</small><b>${fd(rc.ot)}</b></div>`:''}${showCost?`<div class="card stat"><small>Cost</small><b>${money(cost)}</b></div>`:''}<div class="card stat"><small>Members</small><b>${nMem}</b></div><div class="card stat"><small>Entries</small><b>${ents.length}</b></div></div>`;
  const gs=segs('rpg',[['mem','Member'],['loc','Location'],['day','Day']],'mem');
  const table=arr.length?`<table class="t"><thead><tr><th>${{act:'Activity',proj:'Project',loc:'Location',mem:'Member',day:'Day'}[g]}</th><th class="r">Hours</th><th class="r">Share</th><th class="r">Entries</th>${showCost?'<th class="r">Cost</th>':''}</tr></thead><tbody>${arr.map((x,i)=>`<tr><td>${g!=='day'&&i<8?`<i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${PAL[i]};margin-right:8px"></i>`:''}${esc(nameFn(x.k))}</td><td class="r num">${fd(x.worked)}</td><td class="r num">${Math.round(x.worked/Math.max(1,tot)*100)}%</td><td class="r num">${x.n}</td>${showCost?`<td class="r num">${money(x.cost)}</td>`:''}</tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td class="r num">${fd(tot)}</td><td class="r num">100%</td><td class="r num">${ents.length}</td>${showCost?`<td class="r num">${money(cost)}</td>`:''}</tr></tfoot></table>`:empty('No time tracked in this period','Try a wider date range or clear the filters.');
  return bar+tiles+`<div class="two"><div class="card pad"><div class="hd" style="padding:0 0 10px"><h2>Total hours by ${{act:'activity',proj:'project',loc:'location',mem:'member',day:'day'}[g]}</h2></div><div class="row" style="gap:20px;align-items:center;flex-wrap:wrap">${donut}<div style="flex:1;min-width:150px">${arr.slice(0,6).map((x,i)=>`<div class="row" style="gap:8px;padding:3px 0"><i style="width:10px;height:10px;border-radius:3px;background:${PAL[i%PAL.length]}"></i><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(nameFn(x.k))}</span><b class="num">${fd(x.worked)}</b></div>`).join('')||'<span class="mut">Nothing to chart yet</span>'}</div></div></div><div class="card"><div class="hd"><h2>Hours breakdown</h2>${gs}</div><div class="tw">${table}</div></div></div>` }
