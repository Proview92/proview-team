  ents.forEach(e=>{ const p=P(e.pid); const m=emin(e,p,false); rows.push([e.date,p.name,(G(p.g)||{}).name||'',lname(e.loc),e.src==='hours'?'':fT(e.in),e.src==='hours'||e.out==null?'':fT(e.out),m.brk,fh(m.worked),e.st,isAdmin(me())?((p.rate||0)*m.worked/60).toFixed(2):'']) });
  if(!isAdmin(me()))rows.forEach(r=>r.pop()); previewCSV('tracked-time-'+r.from+'-to-'+r.to+'.csv',rows,'Tracked time') };

/* ----- attendance insights ----- */
function rpAtt(){ const r=rpRange(); const ppl=by(rpPeople(),p=>p.name); const t=today(); const last=r.to<t?r.to:addD(t,-1); const rc=rangeCalc(ppl,r.from,r.to,false);
  const rows=ppl.map(p=>{ let sch=0,att=0,late=0,lateMin=0,abs=0; for(let d=r.from;d<=last;d=addD(d,1)){ const pl=planned(p,d); const dc=dayCalc(p,d,false); if(dc.n>0&&dc.worked>0){ if(pl&&pl.from!=null){att++} if(dc.late>LATE_GRACE){late++;lateMin+=dc.late} } if(!pl||pl.from==null||leaveOn(p.id,d,false)||holName(d,p))continue; sch++; if(dc.n===0)abs++ } const ot=rc.byPerson[p.id].ot; return {p,sch,att,late,avg:late?Math.round(lateMin/late):0,abs,ot} });
  const sch=sum(rows,x=>x.sch), att=sum(rows,x=>Math.min(x.att,x.sch)), late=sum(rows,x=>x.late), abs=sum(rows,x=>x.abs), lm=sum(rows,x=>x.avg*x.late);
  const bar=rpBar(); const tiles=`<div class="stats"><div class="card stat"><small>Attendance rate</small><b>${sch?Math.round((sch-abs)/sch*100)+'%':'—'}</b></div><div class="card stat"><small>Late arrivals</small><b>${late}</b></div><div class="card stat"><small>Average lateness</small><b>${late?Math.round(lm/late)+' min':'—'}</b></div><div class="card stat"><small>Absences</small><b>${abs}</b></div></div>`;
  return bar+tiles+(rows.length?`<div class="card tw"><table class="t"><thead><tr><th>Member</th><th class="r">Scheduled days</th><th class="r">Late</th><th class="r">Avg late</th><th class="r">Absent</th>${otOn()?'<th class="r">Overtime</th>':''}</tr></thead><tbody>${rows.map(x=>`<tr><td><div class="who">${av(x.p,'sm')}<b>${esc(x.p.name)}</b></div></td><td class="r num">${x.sch}</td><td class="r num">${x.late?`<span class="chip amber">${x.late}</span>`:'0'}</td><td class="r num">${x.late?x.avg+' min':'—'}</td><td class="r num">${x.abs?`<span class="chip red">${x.abs}</span>`:'0'}</td>${otOn()?`<td class="r num">${x.ot?fd(x.ot):'—'}</td>`:''}</tr>`).join('')}</tbody></table></div><p class="mut" style="margin-top:8px">Counts scheduled working days up to yesterday. Time off and public holidays are not counted as absences. Late means more than ${LATE_GRACE} minutes after the shift start.</p>`:`<div class="card">${empty('Nobody to show')}</div>`) }

      else head+=periods.map((r,i)=>`${esc(lab(r))}: ${aiFmtM(k,tot[i])}`).join(' · ')+'.';
      const mxD=S.shifts.reduce((a,x)=>x.date>a?x.date:a,'0'); const partial=periods.some(r=>r.to>t&&k!=='rota'&&k!=='rotacost'&&k!=='shifts')?'<p class="mut" style="margin:6px 0 0;font-size:13px">Periods that are still running only count up to today.</p>':(['rota','rotacost','shifts'].includes(k)&&periods.some(r=>r.to>mxD)?`<p class="mut" style="margin:6px 0 0;font-size:13px">The rota is only planned up to ${fdate(mxD)}.</p>`:'');
      html+=head+(body.length>1&&(body.length<=14)?aiTbl([byGroup?'Group':'Member'].concat(pl),body):'')+partial+'<p style="margin:10px 0 0"></p>' });

/* ===== staff documents: welcome pack (e-sign), allergen chart, signed document ===== */
const WELCOME_TXT=`## Welcome to Brags and Brams
We are glad you are here. This pack explains how we work day to day. Please read it all, then sign at the bottom. Ask your manager if anything is unclear.

## Your hours and the rota
- The rota runs Monday to Sunday and is made every Sunday for the following week.
- Tell your manager which days you need off as early as you can. Requests made after the rota is published may not be possible.
- Be at your station, in uniform and ready, at your start time.

## Clocking in and out
- Clock in when you start and clock out when you finish, using the app or the shared tablet.
- Never clock in or out for someone else.
- If you forget, tell your manager the same day so your hours can be corrected.

## Breaks
- Take your break when your manager tells you. Unpaid breaks are taken off your hours.

## Being unwell
- If you cannot come in, phone your manager as early as you can, before your shift starts. A text message on its own is not enough.

## Food safety and hygiene
- Wash your hands before work, after the toilet, after handling raw food, bins or money, and whenever they are dirty.
- Tie long hair back, keep nails short and clean, and wear no jewellery on your hands.
- Tell your manager before you start work if you have had sickness or diarrhoea in the last 48 hours.
- Clean as you go and keep your area tidy.

## Allergens
- Customers rely on us to get this right. Never guess.
- If you are asked about allergens, check the allergen chart. If you are not sure, ask your manager before you answer.
- Keep allergen ingredients apart, and clean surfaces and equipment between orders.
- You must have your allergen chart or certificate on file with its expiry date. Your documents are reviewed once a year.

## Cash and the till
- Handle money at the till only, and tell your manager straight away about any mistake.

## Phones and social media
- Keep your phone away while serving. Do not post photos of customers or of private areas without permission.

## Respect and safety
- We treat each other and our customers with respect. Bullying, harassment and discrimination are never acceptable.
- Report accidents, near misses or anything unsafe to your manager straight away.

## Your trial shift
- Your first shift is a trial shift. It lets you and us see if the job is right for you.
- Your manager will tell you the day, start time and how the trial is paid before you start.
- During the trial you follow everything in this pack, the same as any member of the team.
- After the trial we will tell you whether we would like you to join the team, and you can tell us whether you would like to.

## Your onboarding
- On your first day: meet the team, put your things in the staff area, and learn where the fire exits, first aid kit and allergen chart are.
- You will be shown how to use the app to clock in and out, see your rota and ask for time off.
- You will work alongside an experienced team member until your manager is happy you can work on your own.
- Complete your three documents in the app: this signed pack, your allergen chart with its expiry date, and your signed document.
- Ask questions at any time. There is no such thing as a silly question about food safety or allergens.

## Your information
- We keep the documents you give us (your signed pack, allergen chart and signed document) only to run the business and to meet the law. Ask your manager if you want to see them.`;

const dDiff=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const dAddM=(s,n)=>{ const d=pd(s); d.setMonth(d.getMonth()+n); return ds(d) };
const msDay=ms=>ds(new Date(ms));
const CERTS=[['fh','Food hygiene'],['fa','First aid'],['rtw','Right to work']];
function certChip(p,k){ const c=((p.docs||{}).certs||{})[k]; if(!c)return '<span class="mut">—</span>'; const n=dDiff(c,today()); const sd=fdm(c)+(c.slice(0,4)!==today().slice(0,4)?' '+c.slice(2,4):''); return n<0?'<span class="chip red" title="Expired">'+sd+'</span>':n<=30?'<span class="chip amber" title="Ends soon">'+sd+'</span>':'<span class="chip green" title="Valid">'+sd+'</span>' }
const mini=(cls,t,tip)=>'<span class="chip '+cls+' mini" title="'+esc(tip||t)+'">'+t+'</span>';
function reqChips(p){ const st=docSt(p), set=dset(), a=(p.docs||{}).allergen; const ok=(b,t,tip)=>mini(b?'green':'red',t,tip+(b?': on file':': missing'));
  let al; if(!st.allergen)al=mini('red','Allergen','Allergen chart: missing'); else { const n=dDiff(a.expires,today()); al=n<0?mini('red','Allergen','Allergen chart: expired'):n<=30?mini('amber','Allergen','Allergen chart: expires in '+n+' days'):mini('green','Allergen','Allergen chart: valid to '+fdate(a.expires)) }
  return '<div class="reqs">'+ok(st.welcome,'Pack',set.welcome.title)+(isTrial(p)?'<span class="mut" style="font-size:12px">others not needed</span>':al+ok(st.third,'ID',set.third))+'</div>' }
const dTrack=()=>S.people.filter(p=>!p.archived&&!p.noTrack);

function docSt(p){ const d=p.docs||{}, set=dset();
  const welcome=!!(d.welcome&&d.welcome.ver>=set.welcome.ver);
  const allergen=!!(d.allergen&&(d.allergen.file||d.allergen.link)&&d.allergen.expires);
  const third=!!(d.third&&d.third.file);
  return {welcome,allergen,third,n:(welcome?1:0)+(allergen?1:0)+(third?1:0)} }
const isTrial=p=>!!(p&&p.trial&&p.trial.date&&p.trial.date>=today());
const docsComplete=p=>isTrial(p)?docSt(p).welcome:docSt(p).n===3;
const ovrOn=p=>{ const o=p.docs&&p.docs.ovr; return !!o&&(!o.until||o.until>=today()) };
function canStart(p){ if(p&&!p.noTrack&&isTrial(p))return docSt(p).welcome||ovrOn(p); if(!p||!dset().gate||p.noTrack)return true; return docsComplete(p)||ovrOn(p) }
function docsTouch(p){ if(isTrial(p))return; const d=p.docs=p.docs||{}; if(docsComplete(p)&&!d.doneAt){ d.doneAt=Date.now(); S.people.filter(x=>!x.archived&&isAdmin(x)).forEach(a=>notify(a.id,p.name+' has all three documents on file','doc')) } }
function reviewDue(p){ const d=p.docs||{}; if(!docsComplete(p))return null; const base=d.reviewed||d.doneAt; if(!base)return null; return dAddM(msDay(base),dset().reviewMonths||12) }

function docAlertsFor(p){ const out=[]; if(!p||p.noTrack||p.archived)return out; const st=docSt(p), d=p.docs||{}, t=today(), set=dset();
  if(isTrial(p)){ if(!st.welcome)out.push({pid:p.id,k:'miss',sev:ovrOn(p)?'warn':'bad',trial:true,txt:'Trial: the '+set.welcome.title.toLowerCase()+' has not been confirmed yet.'+(ovrOn(p)?' Allowed to start for now.':' Cannot clock in until it is.')}); return out }
  if(st.n<3){ const miss=[!st.welcome&&'welcome pack',!st.allergen&&'allergen chart',!st.third&&set.third].filter(Boolean);
    out.push({pid:p.id,k:'miss',sev:(set.gate&&!ovrOn(p))?'bad':'warn',txt:`${st.n} of 3 documents on file. Missing: ${miss.join(', ')}.`+(set.gate?(ovrOn(p)?' Allowed to start for now.':' Cannot clock in yet.'):'')}) }
  const a=d.allergen; if(a&&a.expires){ const n=dDiff(a.expires,t); if(n<0)out.push({pid:p.id,k:'aexp',sev:'bad',txt:`Allergen chart expired on ${fdate(a.expires)}.`}); else if(n<=30)out.push({pid:p.id,k:'aexp',sev:'warn',txt:`Allergen chart expires in ${plural(n,'day')} (${fdate(a.expires)}).`}) }
  const nx=reviewDue(p); if(nx){ const n=dDiff(nx,t); if(n<=30)out.push({pid:p.id,k:'rev',sev:n<0?'bad':'warn',txt:n<0?`Yearly document review overdue since ${fdate(nx)}.`:`Yearly document review due ${fdate(nx)}.`}) }
  return out }
function docAlerts(){ const m=me(); if(!m||!isTop(m))return []; const ok=new Set(team({scope:'org'}).map(p=>p.id)); return dTrack().filter(p=>p.licensed&&(isAdmin(m)||ok.has(p.id))).flatMap(p=>docAlertsFor(p).map(a=>({...a,name:p.name}))) }

/* ----- file reading (photos are shrunk so everything fits in the browser) ----- */
function readDoc(f,cb){ if(!f){cb(null);return}
  const isImg=/^image\//.test(f.type), isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name);
  if(isImg){ const url=URL.createObjectURL(f); const im=new Image(); im.onload=()=>{ const sc=Math.min(1,1000/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.width*sc)); c.height=Math.max(1,Math.round(im.height*sc)); const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height); const data=c.toDataURL('image/jpeg',0.6); URL.revokeObjectURL(url); cb({name:f.name.replace(/\.[^.]+$/,'')+'.jpg',type:'image/jpeg',size:Math.round(data.length*0.75),data}) }; im.onerror=()=>{URL.revokeObjectURL(url);cb(false,'Could not read that image.')}; im.src=url; return }
  if(isPdf){ if(f.size>250*1024){cb(false,'That PDF is over 250 KB. Take a photo of the page instead, or use a smaller PDF.');return} const r=new FileReader(); r.onload=()=>cb({name:f.name,type:'application/pdf',size:f.size,data:r.result}); r.onerror=()=>cb(false,'Could not read that file.'); r.readAsDataURL(f); return }
  cb(false,'Please choose a photo or a PDF.') }
A.docGet=async d=>{ const p=P(d.pid); const x=p&&p.docs&&p.docs[d.k]; const f=x&&x.file; if(!f){toast('No file to open');return} try{ const b=await (await fetch(f.data)).blob(); await saveFile(f.name,b,b.type) }catch(e){toast('Could not open the file')} };

/* ----- the welcome pack text ----- */
function packHtml(txt){ let h='',inUl=false; String(txt||'').split('\n').forEach(l=>{ if(l.startsWith('- ')){ if(!inUl){h+='<ul>';inUl=true} h+='<li>'+esc(l.slice(2))+'</li>'; return } if(inUl){h+='</ul>';inUl=false} if(l.startsWith('## '))h+='<h3 style="margin:16px 0 4px">'+esc(l.slice(3))+'</h3>'; else if(l.trim())h+='<p style="margin:4px 0">'+esc(l)+'</p>' }); return h+(inUl?'</ul>':'') }
const wfiles=()=>dset().welcome.files||[];
const kb=n=>Math.max(1,Math.round((n||0)/1024))+' KB';
function packFilesHtml(withCk){ const f=wfiles(); if(!f.length)return ''; return `<h3 style="margin:14px 0 6px">Documents to read (${f.length})</h3>${f.map(x=>`<div class="nowc" style="flex-wrap:wrap;gap:8px"><div style="flex:1;min-width:150px"><b>${esc(x.name)}</b><small style="display:block;color:var(--mut)">${/pdf/i.test(x.type||'')?'PDF':'Photo'} · ${kb(x.size)}</small></div><button class="btn sm" type="button" data-a="packFile" data-id="${x.id}">${ic('doc')}Open</button>${withCk?`<label class="ck" style="margin:0"><input type="checkbox" name="ck_${x.id}"> I have read it</label>`:''}</div>`).join('')}` }
A.packFile=d=>{ const f=wfiles().find(x=>x.id===d.id); if(!f){toast('No file to open');return} (async()=>{ try{ const b=await (await fetch(f.data)).blob(); await saveFile(f.name,b,b.type) }catch(e){toast('Could not open the file')} })() };
A.docSign=()=>{ const p=me(), set=dset(); openPanel({title:set.welcome.title,wide:true,saveLabel:'Confirm and sign',body:`<div class="card pad" style="max-height:44vh;overflow:auto;margin-bottom:12px">${packHtml(set.welcome.body)}</div>${packFilesHtml(true)}${lab('Type your full name to sign',inp('name',p.name,'autocomplete="name"'))}<label class="ck" style="margin-top:6px"><input type="checkbox" name="agree"> I have read and understood the ${esc(set.welcome.title.toLowerCase())}${wfiles().length?' and the documents above':''}, including the trial shift and onboarding sections</label><p class="mut" style="font-size:12px">Typing your name and ticking the box is your electronic signature. The date and time are saved with it.</p>`,
  save:v=>{ const miss=wfiles().filter(f=>!v['ck_'+f.id]); if(miss.length){toast('Open each document and tick "I have read it" ('+miss.length+' left)');return false} if(!v.agree){toast('Tick the box to say you have read it');return false} if(!v.name||v.name.trim().length<3){toast('Type your full name to sign');return false}
    p.docs=p.docs||{}; p.docs.welcome={at:Date.now(),name:v.name.trim(),ver:set.welcome.ver,files:wfiles().map(f=>f.id)}; docsTouch(p);
    if(isTrial(p))S.people.filter(x=>!x.archived&&isAdmin(x)).forEach(a=>notify(a.id,p.name+' confirmed the '+set.welcome.title.toLowerCase()+' for their trial','doc'));
    commit(); if(S.ui.handBack){ S.ui.handBack=null; save(); A.signout(); toast('Thank you. Please hand the phone back.'); return } toast('Signed. Thank you.') }}) };
A.docRead=()=>{ const set=dset(); openPanel({title:set.welcome.title,wide:true,nofoot:true,body:`<div class="card pad">${packHtml(set.welcome.body)}${packFilesHtml(false)}</div><div class="row" style="margin-top:12px"><button class="btn" data-a="pclose">Close</button></div>`}) };
A.docPack=d=>{ const p=P(d.pid); const w=p&&p.docs&&p.docs.welcome; if(!w)return; const set=dset(); const t=new Date(w.at); saveFile('welcome-pack-'+p.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.txt',set.welcome.title+' (version '+w.ver+')\n\n'+set.welcome.body.replace(/^## /gm,'').replace(/^- /gm,'* ')+(w.files&&w.files.length?'\n\nDocuments confirmed: '+w.files.map(id=>((wfiles().find(f=>f.id===id)||{}).name||'file')).join(', '):'')+'\n\n---\nSigned electronically by '+w.name+' ('+p.name+') on '+fdate(msDay(w.at))+' at '+pad(t.getHours())+':'+pad(t.getMinutes())+'.','text/plain') };

/* ----- allergen chart and signed document uploads (members, or a manager for them) ----- */
function linksBlock(){ const set=dset(); return `<div class="card pad" style="margin-bottom:12px"><b>Do not have an allergen chart yet?</b><p class="mut" style="margin:4px 0 8px">Do the free allergen training, save your certificate, then add it here.</p><div class="row" style="gap:8px;flex-wrap:wrap"><a class="btn sm" href="${FSA_LINK}" target="_blank" rel="noopener">Free allergen training (Food Standards Agency)</a>${set.allergenLink?`<a class="btn sm" href="${esc(set.allergenLink)}" target="_blank" rel="noopener">Our allergen chart</a>`:''}</div></div>` }
A.docUp=d=>{ const p=P(d.pid); if(!p)return; const k=d.k; const x=(p.docs&&p.docs[k])||{}; const set=dset(); const self=p.id===me().id;
  const body=k==='allergen'
   ?`${linksBlock()}${lab('Photo or PDF of your allergen chart or certificate',`<input type="file" name="file" accept="image/*,application/pdf">`)}${x.file?`<p class="mut" style="margin:-4px 0 8px">On file now: ${esc(x.file.name)}. Choose a new file only to replace it.</p>`:''}${lab('Or a link to it (optional)',inp('link',x.link||'','type="url" placeholder="https://"'))}${lab('Expiry date',`<input type="date" name="expires" value="${x.expires||''}">`)}<p class="mut" style="font-size:12px">We cannot read the date from the file, so please type the expiry date shown on the certificate. If it has no expiry date, enter one year from the date it was issued.</p>`
   :`${lab(set.third+' (photo or PDF)',`<input type="file" name="file" accept="image/*,application/pdf">`)}${x.file?`<p class="mut" style="margin:-4px 0 8px">On file now: ${esc(x.file.name)}. Choose a new file only to replace it.</p>`:''}<p class="mut" style="font-size:12px">Photos are shrunk to fit. PDFs must be under 250 KB.</p>`;
  openPanel({title:(k==='allergen'?'Allergen chart':set.third)+(self?'':' for '+p.name),saveLabel:'Save',body,save:(v,b)=>{
    const f=$('[name=file]',b).files[0];
    if(k==='allergen'){ if(!f&&!x.file&&!(v.link||'').trim()){toast('Add a photo, a PDF or a link');return false} if(!v.expires){toast('Type the expiry date from the certificate');return false} if((v.link||'').trim()&&!/^https?:\/\//i.test(v.link.trim())){toast('The link must start with https://');return false} }
    else if(!f&&!x.file){toast('Choose a file');return false}
    const fin=file=>{ p.docs=p.docs||{}; const n={...x,at:Date.now(),by:me().id}; if(file)n.file=file; if(k==='allergen'){n.link=(v.link||'').trim();n.expires=v.expires}
      p.docs[k]=n; docsTouch(p); commit(); toast(k==='allergen'?(v.expires<today()?'Saved, but that date has already passed.':'Allergen chart saved'):'Saved') };
    if(f){ readDoc(f,(r,msg)=>{ if(r===false){toast(msg||'Could not read the file');return} fin(r) }); return true }
    fin(null); return true }}) };

/* ----- My documents (each member) ----- */
const dTag=(ok,yes,no,warn)=>`<span class="chip ${ok?'green':warn?'amber':'red'}">${ok?yes:no}</span>`;
function fileLine(p,k){ const x=(p.docs||{})[k]; if(!x||!x.file)return ''; const img=/^data:image/.test(x.file.data||''); return `<div class="row" style="gap:10px;margin:8px 0">${img?`<img src="${x.file.data}" alt="" style="width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)">`:`<span class="av sm" style="background:var(--pri)">${ic('doc')}</span>`}<div style="flex:1;min-width:0"><b style="word-break:break-all">${esc(x.file.name)}</b><small style="display:block;color:var(--mut)">Added ${fdate(msDay(x.at))}</small></div><button class="btn sm" data-a="docGet" data-pid="${p.id}" data-k="${k}">${ic('dl')}Open</button></div>` }
function allergenChip(p){ const a=(p.docs||{}).allergen; if(!docSt(p).allergen)return dTag(false,'','Missing'); const n=dDiff(a.expires,today()); return n<0?dTag(false,'','Expired'):n<=30?dTag(false,'','Expires in '+n+' d',true):dTag(true,'Valid to '+fdate(a.expires)) }
V.mydocs=()=>{ const p=me(); const d=p.docs||{}; const st=docSt(p); const set=dset(); const al=docAlertsFor(p);
  const card=(t,chip,body,btns)=>`<div class="card pad" style="margin-bottom:12px"><div class="row" style="gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0;flex:1;font-size:17px">${t}</h2>${chip}</div>${body}<div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap">${btns}</div></div>`;
  const w=d.welcome&&d.welcome.ver>=set.welcome.ver;
  if(isTrial(p))return `<div class="card pad" style="margin-bottom:14px"><b>Your trial on ${fdate(p.trial.date)}</b><p class="mut" style="margin:6px 0 0">Welcome. Read the ${esc(set.welcome.title.toLowerCase())}${wfiles().length?', open each document':''} and confirm it. That is all you need for your trial.</p></div>
   ${card('Welcome pack',dTag(w,'Confirmed','Not confirmed'),w?`<p class="mut" style="margin:8px 0 0">Confirmed by ${esc(d.welcome.name)} on ${fdate(msDay(d.welcome.at))}.</p>`:`<p class="mut" style="margin:8px 0 0">${wfiles().length?plural(wfiles().length,'document')+' to read, then ':''}tick and type your name.</p>`,w?`<button class="btn" data-a="docRead">Read again</button>`:`<button class="btn pri" data-a="docSign">Read and confirm</button>`)}`;
  return `${st.n<3&&set.gate&&!ovrOn(p)?`<div class="alert" style="margin-bottom:14px">${ic('lock')}<div style="flex:1"><b>You cannot clock in until all three documents are on file.</b></div></div>`:''}
   <div class="card pad" style="margin-bottom:14px"><b>${st.n} of 3 documents on file</b><div class="prog" style="margin-top:8px"><i style="width:${Math.round(st.n/3*100)}%"></i></div>${al.filter(a=>a.k!=='miss').map(a=>`<p style="margin:8px 0 0;color:var(--${a.sev==='bad'?'bad':'warn'})">${esc(a.txt)}</p>`).join('')}</div>
   ${card('1. '+esc(set.welcome.title),dTag(w,'Signed','Not signed'),w?`<p class="mut" style="margin:8px 0 0">Signed by ${esc(d.welcome.name)} on ${fdate(msDay(d.welcome.at))}.</p>`:(d.welcome?`<p class="mut" style="margin:8px 0 0">The pack was updated. Please read it and sign again.</p>`:`<p class="mut" style="margin:8px 0 0">Read the pack and sign it with your name.</p>`),w?`<button class="btn" data-a="docRead">Read again</button>`:`<button class="btn pri" data-a="docSign">Read and sign</button>`)}
   ${card('2. Allergen chart',allergenChip(p),fileLine(p,'allergen')+(d.allergen&&d.allergen.link?`<p style="margin:6px 0"><a href="${esc(d.allergen.link)}" target="_blank" rel="noopener">Open your link</a></p>`:'')+(st.allergen?`<p class="mut" style="margin:6px 0 0">Expiry date: <b>${fdate(d.allergen.expires)}</b></p>`:linksBlock()),`<button class="btn ${st.allergen?'':'pri'}" data-a="docUp" data-pid="${p.id}" data-k="allergen">${st.allergen?'Replace or change expiry':'Add my allergen chart'}</button>`)}
   ${card('3. '+esc(set.third),dTag(st.third,'On file','Missing'),fileLine(p,'third')||`<p class="mut" style="margin:8px 0 0">Take a photo or choose a file and upload it here.</p>`,`<button class="btn ${st.third?'':'pri'}" data-a="docUp" data-pid="${p.id}" data-k="third">${st.third?'Replace':'Upload'}</button>`)}` };

/* ----- Documents (managers) ----- */
function staffDocRow(p){ const st=docSt(p), d=p.docs||{}, nx=reviewDue(p), set=dset();
  const rv=nx?(()=>{ const n=dDiff(nx,today()); return dTag(n>30,fdm(nx),n<0?'Overdue':fdm(nx),n>=0) })():'<span class="mut">—</span>';

/* phone: the three less-used buttons sit behind "More", so the list starts higher (owner, 26 Nov 2026) */
A.docMore=()=>openPanel({title:'More',small:true,nofoot:true,body:`<div class="dcm"><button class="btn" data-a="docRemindAll">${ic('bell')}Remind those missing</button><button class="btn" data-a="docOvrAll">Let everyone start for now</button><button class="btn" data-a="docSettings">${ic('gear')}Settings</button></div>`});
A.docPerson=d=>{ const p=P(d.id); if(!p)return; const dd=p.docs||{}, st=docSt(p), set=dset(); const o=dd.ovr||{}; const nx=reviewDue(p);

/* ===== bulk upload of payslips and P45s: match each file to a person, check, then send ===== */
const PAY_LIMIT=4700000, PAY_MAX=400*1024;
const PAY_STOP=new Set('payslip payslips pay slip p45 p60 p11d wage wages salary statement copy final the for of and pdf jpg jpeg png scan scanned employee staff month period week tax year ltd limited brags brams new draft page pages'.split(' '));
const PAY_MON=new Set('january february march april may june july august september october november december jan feb mar apr jun jul aug sep sept oct nov dec'.split(' '));
function payNorm(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ı/g,'i').replace(/İ/g,'i').replace(/ß/g,'ss').toLowerCase() }
function payTokens(name){ const raw=payNorm(String(name||'').replace(/\.[a-z0-9]{2,4}$/i,'')).replace(/([a-z])(\d)/g,'$1 $2').replace(/(\d)([a-z])/g,'$1 $2').replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean);
  const words=raw.filter(t=>/^[a-z]{2,}$/.test(t)); const nums=raw.filter(t=>/^\d+$/.test(t)&&t.length>2&&!/^(19|20)\d\d$/.test(t));
  return {all:words,key:words.filter(t=>!PAY_STOP.has(t)&&!PAY_MON.has(t)).sort().concat(nums).join(' '),nums} }
function payAlias(p){ return [p.name].concat(String(p.payName||'').split(/[,;\n]/)).map(a=>payNorm(a).replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(t=>/^[a-z]{2,}$/.test(t))).filter(a=>a.length) }
function payLev(a,b){ if(Math.abs(a.length-b.length)>1)return 9; const m=a.length,n=b.length,d=[]; for(let i=0;i<=m;i++){d[i]=[i]} for(let j=0;j<=n;j++)d[0][j]=j; for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n] }
function payMatch(fileName){ const T=payTokens(fileName); const set=new Set(T.all); const ppl=S.people.filter(p=>!p.archived&&!p.noTrack);
  const saved=T.key&&(S.payMap||[]).find(x=>x.k===T.key&&ppl.some(p=>p.id===x.pid)); if(saved)return {key:T.key,pid:saved.pid,how:'saved',cands:[saved.pid]};
  const sc=ppl.map(p=>{ let best=0,why=''; const no=String(p.payNo||'').replace(/^0+/,''); if(no&&T.nums.some(n=>n.replace(/^0+/,'')===no)){best=100;why='number'}
    payAlias(p).forEach(a=>{ let s=0; if(a.length>=2&&a.every(t=>set.has(t)))s=100; else if(a.length===1&&set.has(a[0]))s=70; else if(a.length>=2&&a.some(t=>set.has(t)))s=40; else { const f=a.some(t=>t.length>=5&&T.all.some(w=>w.length>=5&&payLev(t,w)<=1)); if(f)s=30 } if(s>best){best=s;why=s===100?'name':s===70?'first':s===40?'part':'close'} });
    return {p,s:best,why} }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||a.p.name.localeCompare(b.p.name));
  if(!sc.length)return {key:T.key,pid:'',how:'none',cands:[]};
  const top=sc[0], tie=sc.filter(x=>x.s===top.s).length>1; const cands=sc.slice(0,3).map(x=>x.p.id);
  if(top.s>=70&&!tie)return {key:T.key,pid:top.p.id,how:top.s===100?'sure':'first',cands};
  return {key:T.key,pid:tie?'':top.p.id,how:'check',cands} }
function payStore(){ let used=0; try{ used=JSON.stringify(S).length }catch(e){} return {used,pct:Math.round(used/PAY_LIMIT*100)} }
function payStoreNote(){ const s=payStore(); if(s.pct<70)return ''; return `<div class="alert ${s.pct>=90?'':'warn'}" style="margin-bottom:12px">${ic('alert')}<span><b>The app's storage is ${s.pct}% full.</b> ${s.pct>=90?'Saving will start to fail soon. Delete old payslips you no longer need.':'Delete old payslips you no longer need before it fills up.'}</span></div>` }
function payShareNote(){ if(typeof SYNC!=='undefined'&&SYNC.on&&SYNC.priv)return 'Each person only receives their own payslips. People with the Payslips permission see everyone\'s.'; return (typeof SYNC!=='undefined'&&SYNC.on)?'<b>Shared mode is on:</b> every phone downloads these files too, so avoid real payslips until personal logins exist.':'Files stay in this browser.' }
const fsz=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
let PB=null;
A.payBulk=()=>{ const y=new Date().getFullYear(), mo=new Date().getMonth(); const ty=mo>=3?y+'/'+String((y+1)%100).padStart(2,'0'):(y-1)+'/'+String(y%100).padStart(2,'0');
  openPanel({title:'Upload many files',saveLabel:'Check the matches',body:`<div class="alert warn" style="margin-bottom:12px">${ic('info')}<span><b>Files must be under 400 KB.</b> If a P45 is a scan, save it smaller first.</span></div>${payStoreNote()}${lab('These are',sel('type',[['payslip','Payslips'],['p45','P45s']],'payslip'))}${lab('Pay period (payslips) or tax year (P45s)',inp('period',MNL[mo]+' '+y,'autocomplete="off"'))}<p class="mut" style="font-size:12px;margin:-4px 0 8px">For payslips, for example October 2026. For P45s, for example ${ty}. It applies to every file.</p>${lab('Choose the files',`<input type="file" name="files" accept="application/pdf,image/*" multiple>`)}<p class="mut" style="font-size:12.5px">The app reads each file name and matches it to a person. You check the list before anything is sent.</p>`,

/* ===== Photos on tasks and checklists (owner, 26 Nov 2026) =====
   Staff add a photo to a task for the day (the phone camera opens); managers see it from anywhere on the Tasks page.
   Each photo is its own small record in S.tkPhotos ({id, tid, d, by, at, data}) so ticking a checklist never re-sends
   pictures. A photo is shrunk to 720px before it is kept, at most 4 for a task on one day, and cleared after 14 days.
   A task can also be set to need a photo before it can be marked done. */
const TKPH_MAX=4, TKPH_DAYS=14;
const tkPhotosOf=(t,d)=>by((S.tkPhotos||[]).filter(x=>x.tid===t.id&&x.d===d),x=>x.at);
const tkPhCan=x=>x.by===me().id||isMgr(me());
function tkPhShrink(f,cb){ if(!f||!/^image\//.test(f.type)){ cb(null,'Please take or choose a photo.'); return }
  const url=URL.createObjectURL(f), im=new Image();
  im.onload=()=>{ const sc=Math.min(1,720/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.width*sc)); c.height=Math.max(1,Math.round(im.height*sc)); const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height); let data=c.toDataURL('image/jpeg',0.55); if(data.length>200000)data=c.toDataURL('image/jpeg',0.4); URL.revokeObjectURL(url); cb(data) };
  im.onerror=()=>{ URL.revokeObjectURL(url); cb(null,'Could not read that photo. Please try again.') }; im.src=url }

function tkPhotoBlock(t,d,pid){ const L=tkPhotosOf(t,d), full=L.length>=TKPH_MAX, old=d<addD(today(),-TKPH_DAYS);
  return `<div class="tkph" id="tkph" data-pid="${pid||''}"><h3>Photos${t.needPh?' <span class="chip amber">Needed to finish</span>':''}</h3>${L.length?`<div class="tkph-g">${L.map(x=>`<button type="button" class="tkph-t" data-a="tkPhView" data-id="${x.id}" title="Open photo" aria-label="Open photo by ${esc((P(x.by)||{}).name||'someone')}"><img src="${x.data}" alt=""><small>${esc(((P(x.by)||{}).name||'').split(' ')[0])} · ${fT(new Date(x.at).getHours()*60+new Date(x.at).getMinutes())}</small></button>`).join('')}</div>`:`<p class="mut" style="margin:0 0 8px">${old?'Photos are kept for '+TKPH_DAYS+' days.':'No photo yet for '+esc(fdate(d))+'.'}</p>`}${old?'':full?`<p class="mut" style="margin:6px 0 0">That is the most for one day (${TKPH_MAX}).</p>`:`<label class="btn tkph-add">${ic('cam')}Add photo<input type="file" accept="image/*" capture="environment" data-i="tkPhoto" data-id="${t.id}" data-d="${d}" data-pid="${pid||''}" hidden></label>`}</div>` }
/* redraw the photo block of the task that is open, without touching anything typed in the form */
function tkPhRefresh(t,d){ const el=$('#tkph'); if(!el||!t)return; const pid=el.dataset.pid||''; el.outerHTML=tkPhotoBlock(t,d,pid) }
I.tkPhoto=el=>{ const f=el.files&&el.files[0]; if(!f||el._busy)return; el._busy=true; /* a file box fires twice (input and change): take the photo once */ const t=S.tasks.find(x=>x.id===el.dataset.id), d=el.dataset.d; if(!t)return;

   Without the server the app keeps working exactly as before, with data in this browser only.
   With the server, every phone sees the same data. Changes are sent as small patches (per item), and each

function syncOne(v){ if(syncIdArr(v)){ const m={}; v.forEach(x=>{m[x.id]=JSON.stringify(x)}); return {arr:true,m} } return {arr:false,j:JSON.stringify(v)} }
function syncSnap(st){ const o={}; Object.keys(st).forEach(k=>{ if(!SYNC_SKIP.has(k))o[k]=syncOne(st[k]) }); return o }
function syncDiff(){ const ops=[], snap=SYNC.snap||{};
  Object.keys(S).forEach(k=>{ if(SYNC_SKIP.has(k))return; const v=S[k], old=snap[k];
    if(syncIdArr(v)){ if(!old||!old.arr){ ops.push({k,set:v}); return } const seen=new Set(), up=[]; v.forEach(x=>{ seen.add(String(x.id)); if(old.m[x.id]!==JSON.stringify(x))up.push(x) }); const del=Object.keys(old.m).filter(id=>!seen.has(id)); if(up.length||del.length)ops.push({k,up,del}) }
    else { const j=JSON.stringify(v); if(!old||old.arr||old.j!==j)ops.push({k,set:v}) } });

function syncApply(ops,st,snap){ ops.forEach(o=>{ const k=o.k; if(o.unset){ delete st[k]; if(snap)delete snap[k]; return }
    if('set' in o){ st[k]=o.set; if(snap)snap[k]=syncOne(o.set); return }
    let arr=st[k]; if(!Array.isArray(arr))arr=st[k]=[]; const sm=snap&&snap[k]&&snap[k].arr?snap[k].m:null;
    (o.up||[]).forEach(x=>{ const i=arr.findIndex(y=>y&&y.id===x.id); if(i>=0)arr[i]=x; else arr.push(x); if(sm)sm[x.id]=JSON.stringify(x) });
    (o.del||[]).forEach(id=>{ const i=arr.findIndex(y=>y&&String(y.id)===String(id)); if(i>=0)arr.splice(i,1); if(sm)delete sm[id] }) }) }

  if(CL.site){ const ss=(await CL.sb.auth.getSession()).data.session; if(!ss){ clKick('auth'); throw new Error('auth') } h.apikey=CL.cfg.key; h.authorization='Bearer '+ss.access_token; h['x-site']=CL.site.id }
  else { let code=''; try{code=localStorage.getItem('proview-code')||''}catch(e){} if(code)h['x-code']=code }
  const tk=lsGet(TKEY()); if(tk)h['x-token']=tk; return h }
// cloud mode: the login, the licence or the membership is no longer good
async function syncCloudErr(r){ if(!CL.site||![401,402,403].includes(r.status))return; let bj={}; try{ bj=await r.clone().json() }catch(e){}
  if(r.status===401&&bj.error==='token')throw new Error('token');
  if(r.status===401){ clKick('auth'); throw new Error('auth') }
  if(r.status===402){ clKick('licence'); throw new Error('licence') }
  if(bj.error==='site'){ clSet('pt-site',''); clKick('site'); throw new Error('site') } }
async function syncFetch(path,opt,ms){ const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),CL.site?Math.max(ms||0,20000):(ms||8000));
  try{ const h=await syncHdr();
    let r=await fetch(syncUrl(path),{...(opt||{}),headers:h,signal:ctl.signal,cache:'no-store'});
    await syncCloudErr(r);
    if(r.status===401&&!CL.site){ let bj={}; try{ bj=await r.clone().json() }catch(e){} if(bj.error==='token')throw new Error('token'); const c=window.prompt('Enter the access code for this app'); if(c){ try{localStorage.setItem('proview-code',c)}catch(e){} h['x-code']=c; r=await fetch(path,{...(opt||{}),headers:h,signal:ctl.signal,cache:'no-store'}) } }
    if(r.status===401)throw new Error('code'); if(!r.ok){ const er=new Error('http '+r.status); er.status=r.status; try{ er.body=await r.json() }catch(e){} throw er } return await r.json() } finally{ clearTimeout(t) } }
function syncAdopt(state,rev){ const ui=S.ui||{}; S=state; S.ui=ui; SYNC.rev=rev; migrate(); SYNC.snap=syncSnap(S); try{ localStorage.setItem(CUR,JSON.stringify(S)) }catch(e){} }
function syncTimers(){ if(SYNC.tm)return; SYNC.tm=1; setInterval(syncPoll,CL.site?60000:3000); if(CL.site){ try{ CL.sb.channel('pt-'+CL.site.id).on('postgres_changes',{event:'*',schema:'public',table:'pt_site_ping',filter:'id=eq.'+CL.site.id},ev=>{ const rv=Number(ev&&ev.new&&ev.new.rev)||0; if(!rv||rv>SYNC.rev)syncPoll() }).subscribe() }catch(e){} } setInterval(syncChip,1500); document.addEventListener('visibilitychange',()=>{ if(!document.hidden)syncPoll() }); window.addEventListener('online',syncPoll) }
async function syncStart(){ const j=await syncFetch('api/state'); const id=lsGet(MKEY()); syncAdopt(j.state,j.rev); if(id&&P(id)&&!(S.ui.real&&S.ui.real!==S.ui.me))S.ui.me=id; SYNC.on=true; syncTimers() }
async function syncInit(){ const cfg=await clCfg(); if(cfg){ await cloudInit(cfg); return }
  try{ if(!/^https?:$/.test(location.protocol))return; const p=await syncFetch('api/ping',{},4000); if(!p||!p.proview)return;
    SYNC.priv=!!p.priv;
    if(SYNC.priv){
      if(!p.hasState){ const st={...S}; delete st.ui; await syncFetch('api/init',{method:'POST',body:JSON.stringify({state:st})},20000) }
      if(!lsGet(TKEY())){ U.login=true; return }
      try{ await syncStart() }catch(e){ if(e&&e.message==='token'){ lsSet(TKEY(),''); U.login=true; return } throw e }
      return }
    SYNC.on=true; let j=await syncFetch('api/state'); if(!j.state){ const st={...S}; delete st.ui; j=await syncFetch('api/init',{method:'POST',body:JSON.stringify({state:st})},20000) } syncAdopt(j.state,j.rev);
    syncTimers() }catch(e){ SYNC.on=false; if(e&&e.message==='code'){ syncLock(); throw e } } }
/* Cloud mode start: sign in, pick the business, then load its shared data. */
async function cloudInit(cfg){ const site=await cloudGate(cfg);
  CUR=KEY+'-c-'+site.id; let c=null; try{ c=JSON.parse(localStorage.getItem(CUR)||'null') }catch(e){}
  S=c&&c.v?c:blankData(site.name,'',clName()); S.ui=S.ui||{}; migrate(); SYNC.priv=true;
  try{
    const p=await syncFetch('api/ping');
    if(!p.hasState){
      if(!(p.master||p.role==='Admin')){ clScreen('fail',{err:'This business has not been set up yet. Ask your business admin to sign in first.'}); return new Promise(()=>{}) }
      const st=blankData(site.name,'',clName()); st.people[0].email=CL.who.email; st.org.email=CL.who.email; delete st.ui;
      await syncFetch('api/init',{method:'POST',body:JSON.stringify({state:st})},30000) }
    if(new URLSearchParams(location.search).get('shared')==='1')clSet('pt-noauto-'+site.id,'1');
    for(let i=0;i<2;i++){
      if(!lsGet(TKEY())&&clGet('pt-noauto-'+site.id)!=='1'){ const r=await syncPost('api/auto',{}); if(r.s===200&&r.j.token){ lsSet(TKEY(),r.j.token); lsSet(MKEY(),r.j.id); clSet('pt-how-'+site.id,'auto') } }
      if(!lsGet(TKEY())){ U.login=true; return }
      try{ await syncStart(); return }catch(e){ if(e&&e.message==='token'&&!i){ lsSet(TKEY(),''); lsSet(MKEY(),''); continue } throw e } }
  }catch(e){ if(CL.kicked)return new Promise(()=>{}); clScreen('fail',{err:'Could not load the data. Check the internet and try again.'}); return new Promise(()=>{}) } }
function syncChip(){ const el=document.getElementById('sv'); if(!el||!SYNC.on)return; if(SYNC.err){ el.className='sv bad'; el.textContent='Offline: not shared' } else if(el.textContent==='Offline: not shared'){ el.className='sv'; el.textContent='Saved' } }
SYNC.mark=function(){ if(!SYNC.on)return; clearTimeout(SYNC.t); SYNC.t=setTimeout(syncPush,350) };
function syncLock(){ SYNC.on=false; SYNC.locked=true; document.body.innerHTML='<div style="font:16px system-ui;padding:32px;max-width:420px;margin:auto"><h2>Access code needed</h2><p>This app is protected. Reload the page and enter the access code when asked.</p><button onclick="try{localStorage.removeItem(\'proview-code\')}catch(e){};location.reload()" style="font:inherit;padding:10px 16px">Reload</button></div>' }
async function syncPush(){ if(!SYNC.on)return; if(SYNC.busy){ SYNC.dirty=true; return } const ops=syncDiff(); if(!ops.length&&!SYNC.cond)return; SYNC.busy=true; const after=syncSnap(S); let res='ok'; const cond=SYNC.cond;
  try{ const r=await syncFetch('api/ops',{method:'POST',body:JSON.stringify({base:SYNC.rev,ops,cond:cond||undefined})},20000); SYNC.snap=after; SYNC.rev=r.rev; SYNC.err=false; SYNC.cond=null; if(r.missed&&r.missed.length)syncRemote(r.missed);
    if(r.dropped)syncResync() }
  catch(e){ if(e&&e.message==='token'){ syncTokenLost(); return } if(e&&e.message==='code'){ syncLock(); return }
    if(e&&e.status===409&&e.body&&e.body.conflict){ SYNC.cond=null; res='conflict'; SYNC.busy=false; await syncResync(true); return res }
    SYNC.err=true; res='err'; setTimeout(()=>SYNC.mark(),4000) }
  SYNC.busy=false; if(SYNC.dirty){ SYNC.dirty=false; SYNC.mark() } return res }
async function syncResync(force){ if(!SYNC.on)return; if(!force&&Date.now()-(SYNC.lastRs||0)<8000)return; SYNC.lastRs=Date.now();
  try{ const j=await syncFetch('api/state'); const ui=S.ui; syncAdopt(j.state,j.rev); S.ui=ui; SYNC.pendRender=true; if(force){ const ae=document.activeElement; if(ae&&ae.blur&&!(ae.closest&&ae.closest('#pnl-root')))ae.blur() } syncRender() }catch(e){ if(e&&e.message==='token')syncTokenLost() } }
function syncTokenLost(){ if(CL.kicked)return; lsSet(TKEY(),''); lsSet(MKEY(),''); try{ localStorage.removeItem(CUR) }catch(e){} location.reload() }
function syncRemote(opsList){ const mid=(me()||{}).id; const had=new Set(S.notifs.map(n=>n.id)); opsList.forEach(ops=>syncApply(ops,S,SYNC.snap)); if(!P(S.ui.me))S.ui.me=S.people[0].id; try{ localStorage.setItem(CUR,JSON.stringify(S)) }catch(e){}
  const fresh=S.notifs.filter(n=>!had.has(n.id)&&!n.read&&(!n.to||n.to===mid)); if(fresh.length){ toast(fresh[0].text.length>90?fresh[0].text.slice(0,88)+'...':fresh[0].text); try{ navigator.vibrate&&navigator.vibrate(120) }catch(e){} }
  SYNC.pendRender=true; syncRender() }
function syncRender(){ if(!SYNC.pendRender)return; const ae=document.activeElement; const typing=ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&!(ae.closest&&ae.closest('#pnl-root')); if(PN||typing)return; SYNC.pendRender=false; render(); syncTitle() }
function syncTitle(){ const n=S.notifs.filter(x=>!x.read&&(!x.to||x.to===(me()||{}).id)).length; document.title=(n?'('+n+') ':'')+(S.org&&S.org.name?S.org.name+' staff':'Staff') }
async function syncPoll(){ if(!SYNC.on||SYNC.busy)return; if(SYNC.pendRender){ syncRender() }
  try{ const r=await syncFetch('api/changes?since='+SYNC.rev,{},6000); SYNC.err=false;
    if(r.snapshot){ const mid=(me()||{}).id; const had=new Set(S.notifs.map(n=>n.id)); syncAdopt(r.snapshot,r.rev); const fresh=S.notifs.filter(n=>!had.has(n.id)&&!n.read&&n.to===mid); if(fresh.length)toast(fresh[0].text); SYNC.pendRender=true; syncRender(); return }
    if(r.ops&&r.ops.length){ SYNC.rev=r.rev; syncRemote(r.ops) } else SYNC.rev=Math.max(SYNC.rev,r.rev) }catch(e){ if(e&&e.message==='token'){ syncTokenLost(); return } if(e&&e.message==='code'){ syncLock(); return } SYNC.err=true } }

/* ===== Personal sign-in (shared mode) ===== */
const LG={step:'list',list:null,org:'',id:'',err:'',busy:false};
async function syncPost(path,body){ try{ const h=await syncHdr(); const r=await fetch(syncUrl(path),{method:'POST',headers:h,body:JSON.stringify(body||{})}); let j={}; try{ j=await r.json() }catch(e){} return {s:r.status,j} }catch(e){ return {s:0,j:{}} } }
async function lgLoad(){ try{ const j=await syncFetch('api/people'); LG.list=j.people||[]; LG.org=j.org||''; LG.err='' }catch(e){ if(e&&e.message==='code'){ syncLock(); return } LG.list=[]; LG.err='Cannot reach the server. Check the internet and reload.' } renderLogin() }
function renderPrivLogin(){ const r=$('#login-root'); if(!LG.list){ r.innerHTML=CL_SPLASH; lgLoad(); return }
  const per=LG.list.find(x=>x.id===LG.id); const org=esc(LG.org||S.org.name||'');
  const err=LG.err?`<div class="notice bad">${esc(LG.err)}</div>`:'', back=`<div class="alinks"><button type="button" data-a="plBack">Back</button></div>`, go=t=>`<button type="button" class="go" data-a="plGo" ${LG.busy?'disabled':''}>${t}</button>`;
  let body='', wide=false;
  if(LG.step==='list'){ wide=true; body=`<h1>Who is signing in?</h1><p class="muted">${org}</p>${err}<div class="pvs-pick">${LG.list.map(p=>`<button type="button" data-a="plPick" data-id="${esc(p.id)}"><b>${esc(p.name)}</b><span>${roleName(p.role)}${p.trial?' · trial':''}</span></button>`).join('')}</div>${CL.site?`<div class="alinks"><button type="button" data-a="clOut">Sign out of this device (${esc(CL.who.email)})</button></div>`:''}` }
  else if(LG.step==='nopin'){ body=`<h1>${esc(per?per.name:'')}</h1><p class="muted">You do not have a PIN yet. Ask your manager to set one for you, then come back.</p>${back}` }
  else if(LG.step==='setup'){ body=`<h1>Welcome, ${esc(per?per.name.split(' ')[0]:'')}</h1><p class="muted">Choose your PIN: 3 to 6 numbers. You will use it every time you sign in.</p>${err}<input id="plpin" class="plin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" placeholder="New PIN" aria-label="New PIN"><input id="plpin2" class="plin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" placeholder="Same PIN again" aria-label="Same PIN again">${go('Save and sign in')}${back}` }
  else { body=`<h1>${esc(per?per.name:'')}</h1><p class="muted">Enter your PIN</p>${err}<input id="plpin" class="plin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="PIN" aria-label="PIN">${go('Sign in')}${back}` }
  r.innerHTML=clPage(body,false,wide);
  const pi=$('#plpin'); if(pi){ pi.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); A.plGo() } }); setTimeout(()=>pi.focus(),50) } const p2=$('#plpin2'); if(p2)p2.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); A.plGo() } }) }
A.plPick=d=>{ const p=LG.list.find(x=>x.id===d.id); if(!p)return; LG.id=p.id; LG.err=''; LG.step=p.pin?'pin':(p.role==='owner'?'setup':'nopin'); renderLogin() };
A.plBack=()=>{ LG.step='list'; LG.id=''; LG.err=''; renderLogin() };
A.plGo=async()=>{ if(LG.busy)return; const pin=($('#plpin')||{}).value||''; if(!/^\d{3,6}$/.test(pin)){ LG.err='Enter 3 to 6 numbers.'; renderLogin(); return }
  let r; LG.busy=true;
  if(LG.step==='setup'){ if(pin!==(($('#plpin2')||{}).value||'')){ LG.busy=false; LG.err='The two PINs are different.'; renderLogin(); return } r=await syncPost('api/setpin',{id:LG.id,pin}) }
  else r=await syncPost('api/login',{id:LG.id,pin});
  LG.busy=false;
  if(r.s===200&&r.j.token){ lsSet(TKEY(),r.j.token); lsSet(MKEY(),r.j.id); if(CL.site)clSet('pt-how-'+CL.site.id,'pin'); try{ S.ui.me=r.j.id; delete S.ui.real; await syncStart(); S.ui.me=r.j.id; U.login=false; U.loc='all'; U.scope='org'; U.page=defaultPage(); U.pop=null; LG.list=null; LG.step='list'; render(); syncTitle() }catch(e){ lsSet(TKEY(),''); LG.err='Could not load your data. Try again.'; renderLogin() } return }
  if(r.s===200&&r.j.setup){ LG.step='setup'; LG.err=''; renderLogin(); return }
  LG.err=r.s===401?'Wrong PIN. Try again.':r.s===429?'Too many tries. Please wait ten minutes.':r.s===403?'Ask your manager to set your PIN.':'Could not sign in. Check the internet.'; renderLogin() };
async function syncSignOut(){ try{ clearTimeout(SYNC.t); let n=0; while(SYNC.busy&&n++<30)await new Promise(r=>setTimeout(r,100)); await syncPush() }catch(e){}
  await syncPost('api/logout',{}); const bk=(()=>{ try{ return JSON.parse(sessionStorage.getItem('proview-back')||'null') }catch(e){ return null } })();
  try{ sessionStorage.removeItem('proview-back') }catch(e){}
  try{ localStorage.removeItem(CUR) }catch(e){}
  if(bk&&bk.t){ lsSet(TKEY(),bk.t); lsSet(MKEY(),bk.id) } else { lsSet(TKEY(),''); lsSet(MKEY(),'');
    if(CL.site){ if(clGet('pt-how-'+CL.site.id)==='pin')clSet('pt-noauto-'+CL.site.id,'1'); else { clSet('pt-site',''); try{ await CL.sb.auth.signOut() }catch(e){} } } }
  setTimeout(()=>location.reload(),bk?1600:50) }

/* ---- 99-boot.js ---- */
(function boot(){
  try{ applyColors() }catch(e){} try{ applyDense() }catch(e){} try{ const th=localStorage.getItem(KEY+'-theme'); if(th)document.documentElement.setAttribute('data-theme',th); const c=localStorage.getItem(KEY+'-cur'); if(c&&localStorage.getItem(c))CUR=c }catch(e){}
  load();
  syncInit().then(()=>{ closeStale(); U.page=defaultPage(); render(); syncTitle() }).catch(()=>{});
})();
